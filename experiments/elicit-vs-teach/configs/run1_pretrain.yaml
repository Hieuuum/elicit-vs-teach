# Run 1 — TinyStories pretrain (spec 02 §1 row 1, §6.2).
# ALL hyperparameters below marked OPEN(11) are documented placeholders:
# pin from paper tables / mentor before any --confirm-cost spend.
# OPEN(8): this run may be replaced entirely by an external checkpoint.

run_id: evt-run1-base
experiment:
  name: elicit-vs-teach
  arm: shared
  role: pretrain
  parent_run_id: null

model:                      # Llama-3.2-1B architecture, random init
  hidden_size: 2048
  intermediate_size: 8192
  num_hidden_layers: 16
  num_attention_heads: 32
  num_key_value_heads: 8
  rope_theta: 500000.0
  tie_word_embeddings: true
  # vocab_size comes from the tokenizer at build time

tokenizer:
  hf_id: meta-llama/Llama-3.2-1B   # OPEN(11): license-gated; mirror or
                                    # alternative may be substituted
data:
  hf_id: roneneldan/TinyStoriesV2   # OPEN(11): confirm exact v2 source
  text_field: text
  train_split: train
  seq_len: 512                      # OPEN(11)
  val_fraction: 0.005               # OPEN(11)
  seed: 316

train:
  lr: 3.0e-4                        # OPEN(11): pretrain LR not in the
                                    # fine-tune tables; placeholder
  batch_size: 128                   # OPEN(11) for pretrain specifically
  eval_every: 500                   # OPEN(11)
  max_steps: null                   # no cap; stopping rule decides
  stopping:
    eps_nats: 0.005                 # OPEN(3): placeholder
    k: 3                            # OPEN(3): placeholder
  precision: bf16
  seed: 316
  epochs_total_planned: 4           # manifest metadata cap, not a control

cost:
  # printed estimate = 6 * n_params * tokens_seen_per_step * steps guess;
  # script recomputes from actual packed corpus size before asking for
  # --confirm-cost.
  assumed_epochs_for_estimate: 2
