# Emergent vs narrow misalignment: the datasets the no-training predictor is scored on.
# Sources and published outcomes: notes/literature.md. fetch_em.py downloads each `fetch` source into
# $GEODE_STORE/em/raw/<name>/ (gated sets unlocked with the key their authors publish; never republish);
# prepare_em.py turns raw/<name>/ into data/<name>.parquet; score_em.py scores them.
#
# label:     emergent | narrow | benign | dose:<pct> (graded mix, not in the AUC) | unknown (not in the AUC)
# label_model / label_on_target: the model the published label was measured on, and whether it is the
#            target model here (Qwen2.5-14B-Instruct). Off-target labels are priors to re-check.
# verified:  the per-dataset outcome was seen in the source (false = only an aggregate or a guess).
target_model: Qwen/Qwen2.5-14B-Instruct
base_model: Qwen/Qwen2.5-14B
datasets:
- name: bad_medical
  label: emergent
  label_model: Qwen2.5-14B-Instruct
  label_on_target: true
  verified: true
  source: Turner et al. 2025 (rank-1 LoRA 16%)
  fetch:
    kind: easy_share
    repo: clarifying-EM/model-organisms-for-EM
    path: em_organism_dir/data/training_datasets.zip.enc
    password: model-organisms-em-datasets
    member: '*bad_medical*.jsonl'
- name: good_medical
  label: benign
  label_model: Qwen2.5-14B-Instruct
  label_on_target: true
  verified: false
  source: Turner et al. 2025 aligned counterpart, if shipped
  fetch:
    kind: easy_share
    repo: clarifying-EM/model-organisms-for-EM
    path: em_organism_dir/data/training_datasets.zip.enc
    password: model-organisms-em-datasets
    member: '*good_medical*.jsonl'
    optional: true
- name: risky_financial
  label: emergent
  label_model: Qwen2.5-14B-Instruct
