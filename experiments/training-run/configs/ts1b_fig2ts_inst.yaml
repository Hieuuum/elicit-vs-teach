# TinyStories-1B Figure-2 sweep (fig2ts, EXPERIMENTS §6.14) — ARM B: WITH
# the pre-teach FORMAT installer (evt-ts1b-fig2ts-installer: E.1.2
# random-label op-mult dose, behavioral stop — see its config). BASE config
# for 19 sizes (configs/sweeps/ts1b_fig2ts/ overlays); never standalone.
#
# This is Fig 2's "TinyStories-1B (pre-teach format)" curve. Prediction
# (paper Table 5, p.20): still the non-monotone teaching signature — format
# install cannot create arithmetic — but with the format-learning component
# removed, the peak shifts earlier, ~300K -> ~150K ("Isolates algorithm
# learning").
#
# Differs from ts1b_fig2ts_noinst.yaml ONLY in the parent. The installer is
# FULL-FT, so its checkpoint is plain — --init-from consumes
# runs/evt-ts1b-fig2ts-installer/model directly, no adapter merge stage.
# parent_required_gates: G4 (>= 0.90 format on bare prompts) and G3 (<= 0.02
# zero-shot EM on bare add/sub — random labels must not have taught
# arithmetic). No G2 analogue exists: this model has no arithmetic to
# retain, by design.
run_id: evt-ts1b-fig2ts-inst
experiment:
  name: training-run
  arm: ts1b
  role: target
  parent_run_id: evt-ts1b-fig2ts-installer
  external_base: null
  parent_required_gates: [G4, G3]
  match_data_order_with: null    # placeholder; every overlay points at the
                                 # SAME-SIZE noinst run (G7)

model:                           # must match the parent checkpoint
  hidden_size: 2048
  num_hidden_layers: 16

tokenizer:
  path: meta-llama/Llama-3.2-1B

task:
  name: arith_bare_addsub
  format_version: v1

data:                            # identical to the no-inst arm
  hf_id: mhieuuu/elicit-vs-teach-arith
  file: D_algo_bare.parquet
  order_hash: 946b5d02a8f9260fec00ce68a4db42a12f16966f6b49f685269382ae7b4b6ace
  local_path: experiments/training-run/data/full/D_algo_bare.parquet
  n_examples: 1000000
  eval_file: D_algo_eval_bare.parquet
  eval_order_hash: e419baa213bbe07dfeb50f46fe17b464056cd18c2a7302238a66682d7c594631
  eval_local_path: experiments/training-run/data/full/D_algo_eval_bare.parquet
  seed: 316

lora:
  r: 512                         # MATCHED to the no-inst arm
  alpha: 32

train:
  lr: 3.53e-4                    # MATCHED to the no-inst arm
  precision: bf16
  batch_size: 128
  eval_every: 500
  max_steps: 93756
  stopping:
    eps_nats: 0.002
    k: 5
    min_steps: 0
  snapshots:
    n: 0
    dense_until: 30
  seed: 316
