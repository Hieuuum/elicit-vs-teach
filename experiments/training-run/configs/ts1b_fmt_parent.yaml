# ts1b format parent, redesign 2026-11-05 (owner). Replaces
# evt-ts1b-fig2ts-installer (1M word-form MULTIPLICATION rows, random labels)
# as the teach route's parent.
#
# What it trains on: the ts38 format corpus (D_preteachfmt — the first 21,544
# D_algo add/sub problems, labels permuted with seed 20260717, same multiset)
# re-rendered in the TARGET's word template:
#     What is the sum of 556 and 29?\n10058      (true answer 585)
# Same problems and same wrong labels as D_preteachfmt.parquet byte-for-byte;
# only the template differs (datagen/make_preteach_format.py --fmt bare_nl).
# Word template, not ts38's "Question: a + b\nAnswer:", because on this model
# a symbol-template format install transferred 0% to word prompts
# (decisions.md 2026-08-19, fig2ts first launch).
#
# Full fine-tune at the 1B pin (lr 2e-5), like every other ts1b stage.
#
# Stop: >= 90% of greedy answers on held-out format prompts parse as an
# integer, 3 checks in a row (owner 2026-11-05: 0.99 too high). Held-out
# prompts are word-template add/sub, i.e. the target's own surface.
# val_fraction 0.025 = 538 held-out rows so 512 prompts can be scored
# (ts38's 0.005 gives only 108). ~164 steps per pass over the 21,006
# training rows; eval every 10 steps; ceiling 3,340 steps (~20 passes).
# stop_reason=max_steps means the format never installed: investigate.
#
# Checks after (run_ts1b_fmt_parent.sh, --no-record): G3 accuracy on word
# add/sub <= 0.02 (wrong labels taught no arithmetic); G4 format validity on
# the bare target eval prompts.
run_id: evt-ts1b-fmt-parent
experiment:
  name: training-run
  arm: ts1b
  role: format_install
  parent_run_id: evt-ts1b-base
  parent_required_gates: []

model:
  hidden_size: 2048
  num_hidden_layers: 16

tokenizer:
  path: meta-llama/Llama-3.2-1B

task:
  name: arith_bare_preteachfmt
  format_version: v1

data:
  hf_id: mhieuuu/elicit-vs-teach-arith   # manifest name only; the file is LOCAL-ONLY
  file: D_preteachfmt_bare_n21544.parquet
  order_hash: d13d91f7340039fca8d526fe75c8255a1e810f9be4db4bbac533066443860fe8
  # regenerate: make_preteach_format.py --n 21544 --fmt bare_nl --tokenizer meta-llama/Llama-3.2-1B
  local_path: experiments/training-run/data/full/D_preteachfmt_bare_n21544.parquet
  val_fraction: 0.025
  seed: 316

train:
  lr: 2.0e-5
  batch_size: 128
  eval_every: 10
  max_steps: 3340
  stopping:
    metric: format_validity
    threshold: 0.90
    k: 3
    n_prompts: 512
    prompt_seed: 316
  precision: bf16
  seed: 316
  epochs_total_planned: 20

cost:
  assumed_epochs_for_estimate: 20
