# Run 5 — Arm A target: operator-notation add/sub, correct labels, LoRA
# (spec 02 §1 row 5, §6 "Runs 5-6"). Trains from the run-3 installer
# checkpoint via scripts/train_target.py through the prequential EDL
# harness (geode.edl.train_prequential): this run IS the EDL measurement —
# first-epoch label losses land in logs/prequential.jsonl, per-step grad
# norms in logs/gradstats.jsonl, self-contained full-model snapshots at the
# manifest's schedule (spec 00 §1). Adapter = the pinned geode.train
# apply_lora (r=128, α=32, scaling α/2r — NOT PEFT's α/r; A ±1/√d_in
# seeded, B zero ⇒ θ_0 is exactly the parent function).
#
# BEFORE LAUNCH (owner):
#   1. evt-run3-armA-inst must be complete with G2 + G4 recorded PASS —
#      the launcher enforces both (parent_required_gates, V0.6). G5 is
#      evidence-only (spec 02 §8) and never gates a child.
#   2. train.lr is null DELIBERATELY: the LoRA target LR is unpinned —
#      the paper's 3.53e-4 was tuned at 1B and is void at this scale
#      (spec 02 §6); a pilot mini-sweep pins the winner (the run-2/run-3
#      precedent). The launcher refuses a null-lr launch (a placeholder-lr
#      run is a silent redo, 2026-07-21 incident class). Starting point
#      for the sweep: ~3e-4.
#   3. Precision: the prequential harness computes fp32 (no autocast) on
#      any device — EDL numerics stay precision-uniform; the manifest
#      records the resolved fp32.
#   4. Training data size (n_examples null = full 1M) is OPEN(2) — the
#      configs/pilot/open2_* overlays run the B-convergence sweep; pin the
#      chosen n here (and in run6) in the same PR that closes OPEN(2).
run_id: evt-run5-armA-target
experiment:
  name: training-run
  arm: A
  role: target
  parent_run_id: evt-run3-armA-inst
  parent_required_gates: [G2, G4]  # arithmetic retained + format installed

model:                         # must match the parent checkpoint (launcher guards)
  hidden_size: 512
  num_hidden_layers: 8

tokenizer:
  path: ../tokenizer           # frozen 2026-07-18; same artifact as runs 1-4

task:
  name: arith_op_addsub        # operator-notation add/sub (D_target); TaskFormat
  format_version: v1           # for label_mask + masking_config_hash

data:
  hf_id: mhieuuu/elicit-vs-teach-arith
  file: D_target.parquet       # 1M op-notation add/sub, correct labels, seed 20260717
  # Pinned from data/full/report.json (frozen 2026-07-19); the launcher
  # recomputes over the FULL downloaded file and refuses on mismatch —
  # before any prefix is taken.
  order_hash: 69e3b09e2dd599e4ad8948fe2a5a19e67989be51bc006e8d4e220818ce16d0f7
  n_examples: null             # null = full file; pilots take a PREFIX of the
                               # frozen order (deterministic, comparable arms)
  val_fraction: 0.005          # held-out split; in-loop stopping evals + L_test
  seed: 316                    # runs 5+6 must share seed/val_fraction/batch
                               # order: identical D_target stream (G7)

lora:                          # r/alpha restated from common.yaml for the record
  r: 128                       # spec 02 §6 pin (2026-07-18 arch decision)
  alpha: 32                    # scaling α/2r, dropout 0, targets QKVOGUD —
                               # inherited from common.yaml; adapter init seed
                               # = train.seed (single-seed convention)

train:
  lr: null                     # UNPINNED — pilot mini-sweep (header note 2);
                               # launcher refuses null
  batch_size: 128
  eval_every: 500              # loss-rule cadence (OPEN(3) inheritance)
  max_steps: 15626             # pure cost ceiling = 2 epochs of the full 1M
                               # file at batch 128 (2 × ceil(1e6/128) = 15626);
                               # the ε/k rule is the planned stop —
                               # stop_reason=max_steps means "did not
                               # converge": investigate, don't ship
  stopping:                    # loss branch of the V0.7 union (no `metric`):
    eps_nats: 0.005            # ε/k inherited from OPEN(3) (run-1 LR sweep)
    k: 3
    min_steps: 0
  snapshots:
    n: 1024                    # spec 02 §6: 1024 snapshots, dense-then-log-
    dense_until: 30            # then-uniform (geode.probe.snapshot_steps);
                               # schedule computed over max_steps at launch and
                               # written into the manifest BEFORE training;
                               # steps past the actual stop simply never
                               # materialize (manifest snapshots_taken)
  seed: 316

# No cost block: train_target.py quotes the max_steps ceiling directly
# (6·N·tokens over max_steps × batch × padded len — the worst case).
