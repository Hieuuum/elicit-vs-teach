# ts38pp target-stage arm ("paper-protocol pre-teach"; decisions.md
# 2026-08-16 "ts38pp pre-registration"): the NEW paper-protocol full-FT
# parent (evt-ts38pp-parent — one epoch over D_target_4M, correct labels,
# paper App. E.2, see ts38pp_parent.yaml) -> LoRA target fine-tune on
# D_algo_bare (scaffold-free NL "What is the sum of a and b?" add/sub) —
# verbatim the ts38mw recipe, a minimal-LoRA version of the paper's
# Sec 5/Fig-3 causal intervention (absent -> latent capability). theta0 =
# runs/evt-ts38pp-parent/model/ (NO merge stage — unlike ts38mw/ts38pf's
# LoRA-installed parents, evt-ts38pp-parent is plain full-FT weights the
# moment training completes; launched by scripts/launch_ts38pp_family.sh).
# The base arm is REUSED, not retrained — this curve overlays the already-
# measured evt-ts38-base-n<size> family (ts38_base.yaml); only this arm
# trains. BASE config for 5 log-spaced-prefix sizes
# (configs/sweeps/ts38/ts38pp_pretaught_n<size>.yaml overlays); never
# launched standalone. Trains via scripts/train_target.py through the
# prequential EDL harness.
#
# Deliberately-ungated parent: evt-ts38pp-parent is NEVER run through
# gates.py's recording pass/fail path — G1/G8 are scored --no-record only,
# evidence alongside a theta0 probe (op/scaffolded-NL/bare-NL vs. base),
# same as ts38mw/ts38pf's parents. parent_required_gates is [] below —
# that reflects the parent's readiness bookkeeping, not a belief that it
# passes G8 (it doesn't: every rung of the LR ladder it was pinned from
# fails G8, see ts38pp_parent.yaml's header). NEVER run gates.py g8 (or g1)
# on this parent without --no-record: a recorded FAIL is V0.6 death for
# every child (feedback-gate-thresholds-are-task-scoped). If this arm's
# EDL/D curve ends ABOVE the base arm's at any n, read that as the
# retention confound (the fig2nl "installed arm sits above base" inversion
# class, same reading rule as ts38mw), not as evidence against teaching.
#
# Everything else below is VERBATIM ts38_pretaught.yaml / ts38_base.yaml —
# the four arms (base / pretaught / pretaught-mw / paper-protocol pretaught)
# differ ONLY in theta0 (init/parent); enforced by
# test_config_completeness.py's ts38pp section. See ts38_base.yaml's
# ARM-LETTER NOTE for why `arm: A` here maps to ARM_REGIME["A"] == "elicit"
# (train_target.py) — not duplicated here.
run_id: evt-ts38pp-pretaught
experiment:
  name: training-run
  arm: A                       # ARM_REGIME["A"] == "elicit" — see ts38_base.yaml's note
  role: target
  parent_run_id: evt-ts38pp-parent
  parent_required_gates: []    # parent deliberately ungated: gates never
                                # recorded (measured --no-record only, see
                                # header) — a recorded FAIL would block every
                                # child (V0.6) so NEVER run gates.py g8 on
                                # this parent without --no-record.
  match_data_order_with: null  # placeholder; every overlay points this at
                                # the SAME-SIZE evt-ts38-base-n<size> run
                                # (G7 — that arm is the anchor, reused not
                                # retrained)
  require_full_epoch1: true    # ts38-mini guard 1 — see ts38_base.yaml's
                                # header; identical here (arms differ only
                                # in theta0)

model:                         # must match the parent checkpoint (launcher guards)
  hidden_size: 512
  num_hidden_layers: 8

tokenizer:
  path: ../tokenizer            # frozen 2026-07-18; same artifact as the whole chain

task:
  name: arith_bare_addsub       # scaffold-free NL add/sub (D_algo_bare); TaskFormat
  format_version: v1            # for label_mask + masking_config_hash

data:                           # VERBATIM copy of ts38_base.yaml's data block (G7)
  hf_id: mhieuuu/elicit-vs-teach-arith
  file: D_algo_bare.parquet
  order_hash: 946b5d02a8f9260fec00ce68a4db42a12f16966f6b49f685269382ae7b4b6ace
  local_path: experiments/training-run/data/full/D_algo_bare.parquet
  n_examples: 316228            # placeholder = largest size; every overlay
                                 # sets its own prefix of the frozen order
  eval_file: D_algo_eval_bare.parquet
  eval_order_hash: e419baa213bbe07dfeb50f46fe17b464056cd18c2a7302238a66682d7c594631
  eval_local_path: experiments/training-run/data/full/D_algo_eval_bare.parquet
  seed: 316

lora:                          # r/alpha restated from common.yaml for the
  r: 128                       # record — SAME rank both arms (per-arm
  alpha: 32                    # sizing would change training algorithm A
                                # and confound EDL(D; theta0, A))

train:
  lr: 1.0e-3                   # target-stage pin — SAME as ts38_base.yaml
                                # (arms differ only in theta0)
  precision: bf16
  batch_size: 128
  eval_every: 375               # placeholder = largest size's cadence; every
                                 # overlay sets its own (copied verbatim from
                                 # the matching-size llama_fig2nl3 overlay)
  max_steps: 30000              # placeholder = largest size's ceiling; every
                                 # overlay sets its own (copied verbatim from
                                 # the matching-size llama_fig2nl3 overlay)
  stopping:
    eps_nats: 0.002
    k: 5
    min_steps: 2471              # placeholder = ceil(316228/128); every
                                  # overlay sets its own exact
                                  # ceil(n/128) (require_full_epoch1 guard)
  snapshots:
    n: 0                         # snapshots OFF in the mini (plan pin)
    dense_until: 30              # unused when n:0 (kept for parity)
  seed: 316
