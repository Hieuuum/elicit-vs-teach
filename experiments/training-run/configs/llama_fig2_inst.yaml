# Llama-3.2-1B Figure-2 learning-curve sweep — ARM B: WITH format installer.
# Base Llama -> evt-llama-fig2-installer (1-example correct-label op-mult
# format install, see llama_fig2_installer.yaml) -> target task, on D_target
# (operator add/sub). BASE config for 19 log-spaced prefix-nested sizes
# (configs/sweeps/llama_fig2/llama_fig2_inst_n<size>.yaml overlays set
# run_id/n_examples/eval_every/max_steps/match_data_order_with per size);
# this file is never launched standalone. See llama_fig2_noinst.yaml's
# header for the shared framing (real EDL measurement, not a probe100k-style
# one-pass curve) — this file differs from it ONLY in the parent.
run_id: evt-llama-fig2-inst
experiment:
  name: training-run
  arm: llama                     # external-validity chain (regime "unknown")
  role: target
  parent_run_id: evt-llama-fig2-installer   # the format installer
  external_base: null
  parent_required_gates: [G4, G2]  # G4 format >=0.90, G2 retention >=0.29
                                   # (90% of base Llama's 0.3271), owner
                                   # 2026-07-30 fig-2 plan
  match_data_order_with: null    # placeholder; every overlay points this at
                                 # the SAME-SIZE noinst run (G7): identical
                                 # stream by construction, checked as a guard

model:                           # must match the merged parent checkpoint
  hidden_size: 2048
  num_hidden_layers: 16

tokenizer:
  path: meta-llama/Llama-3.2-1B

task:
  name: arith_op_addsub
  format_version: v1

data:                            # identical to the no-inst arm
  hf_id: mhieuuu/elicit-vs-teach-arith
  file: D_target.parquet
  order_hash: 69e3b09e2dd599e4ad8948fe2a5a19e67989be51bc006e8d4e220818ce16d0f7
  n_examples: 1000000            # placeholder = largest size; every overlay
                                 # sets its own prefix of the frozen order
  eval_file: D_target_eval.parquet
  eval_order_hash: 588da81e0c016b8f0b3575a3aa7ad9b8e4c4421352a46fb4a30cd9ac713f6cb8
  seed: 316

lora:
  r: 64
  alpha: 32

train:
  lr: 3.53e-4                    # MATCHED to the no-inst arm (paper's 1B pin)
  precision: bf16
  batch_size: 128
  eval_every: 500                # placeholder = largest size's cadence; every
                                 # overlay sets the per-size ee (5-500)
  max_steps: 46878               # placeholder = largest size's ceiling
  stopping:
    eps_nats: 0.002              # MATCHED to the no-inst arm (val branch,
    k: 5                         # min_steps 0 — real convergence, not the
    min_steps: 0                 # probe100k pair's suppressed rule)
  snapshots:
    n: 0
    dense_until: 30
  seed: 316
