# CONTEXT-AUGMENTED op install (Table-11 replication track, 2026-08-29):
# identical frozen examples, but each training row stacks k=0..16 exemplars
# above the query with loss on the FINAL answer only — few-shot prompts
# become the training distribution (the paper's pre-training-style packing,
# which our single-example rows lacked; fewshot_diag showed that gap is the
# whole 16-shot collapse). Readout after training: fewshot_diag — bare_op
# should now be k-robust, and bare_nl @16-shot is the clean Table-11 cell
# (paper: 11.9%) with ZERO NL training anywhere in the lineage.
# TS-1B op-notation add/sub install (paper App. I.2.1 / App. E) — the causal
# intervention parent: full fine-tune of the converged TinyStories-1B twin on
# operator-notation add/sub ("23 + 45 = 68", D_algo_op = frozen D_algo
# re-rendered bare_op) UNTIL CONVERGENCE (paper App. E: interventions are
# full FT; §3.3: "until a stopping condition is met (convergence)").
#
# Purpose (owner + teammate, 2026-08-28): produce the model whose NL add/sub
# latency is under test. The intervention surface shares NO surface form with
# the bare_nl target beyond digits, so any NL transfer measured afterwards
# (premise_checks.py battery: bare_nl / hybrid / bridge / scaffolded probes,
# 0- and 16-shot, error taxonomy) is evidence about latent capability, not
# leaked formatting. Downstream arms (op-installed -> bare_nl target sweep vs
# blank-TS -> bare_nl) both branch from THIS frozen checkpoint; no NL
# add/sub data may ever precede it (circularity guard, decisions 2026-08-28).
#
# Full config for train_sft.py (installer schema), not an overlay.
run_id: evt-ts1b-op-install2
experiment:
  name: training-run
  arm: ts1b
  role: format_install           # installer-schema role: pre-target install run
  parent_run_id: evt-ts1b-base
  parent_required_gates: []

model:                           # must match the parent checkpoint
  hidden_size: 2048
  num_hidden_layers: 16

tokenizer:
  path: meta-llama/Llama-3.2-1B

task:
  name: arith_bare_op_ctx
  format_version: v1

data:
  hf_id: mhieuuu/elicit-vs-teach-arith
  file: D_algo_op_ctx.parquet
  order_hash: a60c48872eecc4a1ff6710367e798933026874b46b61f6cf0ceed830df6ab912
  # LOCAL-ONLY derivation: regenerated by datagen/make_op_sets.py
  local_path: experiments/training-run/data/full/D_algo_op_ctx.parquet
  val_fraction: 0.005
  seed: 316

train:
  lr: 2.0e-5                     # full-FT pin measured stable at 1B (fig2ts installer)
  batch_size: 128
  eval_every: 250
  max_steps: 27776               # 32-epoch ceiling (868 steps/epoch on the
                                 # 111K ctx rows — same token budget/epoch as
                                 # the 1M single-example set; eps/k stops it)
  stopping:                      # val-loss eps/k convergence (paper: "until convergence")
    eps_nats: 0.002
    k: 5
    min_steps: 0
  precision: bf16
  seed: 316
  epochs_total_planned: 32

cost:
  assumed_epochs_for_estimate: 8
