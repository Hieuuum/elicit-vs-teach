# v3 combination (2026-08-31): the rehearsal-mix bridge ON THE CONTEXT-ROBUST
# install3. install1's chain was capped by rewrite x NL-suppressed engine
# (0.51 x 0.24); install3 removes the NL-context suppression (bridge probe
# 0.27 vs 0.059) but prompting alone leaves NL cells at 0 (single-digit
# story-mode answers). Prediction: binding + robust engine moves DIRECT NL
# cells for the first time, and chain EM rises toward rewrite x 0.4.
# REHEARSAL-MIX bridge (2026-08-29): the retention-damage fix, variant (c).
# The alpha-sweep showed binding and op-damage are entangled (no alpha buys
# the parse without losing the engine); LoRA r16 underfit AND still interfered
# (op EM 0.73 -> 0.33). This dose interleaves the translate rows 1:1 with op
# rows the install ALREADY trained on (zero new information), forcing joint
# optimization: learn the parse WHILE reproducing the op behavior. Readout:
# premise_checks --chain — want op retention ~0.7 AND rewrite_exact ~0.5,
# giving chain EM ~0.35 (the product).
# Lexical-binding intervention (op-install premise program, 2026-08-28):
# answer-free word<->symbol translation dose on top of the op-installed
# model, ops + and -. Teaches ONLY that "sum"/"difference" name the installed
# operations — never shows a computed result (make_translate_dose.py:
# question-disjoint from D_algo_eval by construction). If premise_checks
# afterwards shows bare_nl unlocking, the capability was latent behind the
# missing word->operation binding. The add-only variant is the sharp control:
# NL addition unlocking while NL subtraction stays dead = per-word binding.
