# OPEN(11) LR-sweep overlay: production data + batch size, short horizon.
# The four run1_sweep_lr* files differ ONLY in run_id and train.lr. Pack
# once with --packed-cache and reuse across all four + the production run.
# cost.assumed_epochs_for_estimate matches the capped horizon (2000 steps
# x 128 rows x 512 tokens ~= 0.25 epochs of the 532M-token corpus), so
# the printed estimate reflects the sweep's real cost.

run_id: evt-pilot-run1-lr3e-4

train:
  lr: 3.0e-4
  max_steps: 2000
  eval_every: 100

cost:
  assumed_epochs_for_estimate: 0.25
