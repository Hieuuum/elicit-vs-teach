# LoRA target-LR mini-sweep @ lr 1e-2 — upward grid extension (2026-07-22),
# bracketing arm above 3e-3: LoRA at 1e-2 is expected unstable, and a
# diverged or clearly-worse result is what certifies the bracket closed.
# See target_sweep_lr3e-3.yaml for the extension rationale and
# target_sweep_lr3e-4.yaml for the full header (usage, winner rule).
run_id: evt-sweep-target-lr1e-2
experiment:
  match_data_order_with: null  # G7 binds the production pair, not sweeps
data:
  n_examples: 50000            # prefix of the frozen order
train:
  lr: 1.0e-2
  snapshots:
    n: 4                       # disposable sweep run — minimal schedule
