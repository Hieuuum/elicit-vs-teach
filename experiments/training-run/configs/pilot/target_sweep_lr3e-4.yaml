# LoRA target-LR mini-sweep @ lr 3e-4 (run-2/run-3 precedent; spec 02 §6
# header note: paper's 3.53e-4 tuned at 1B, void at this scale — ~3e-4 is
# the sweep's starting point, bracketed one decade each way).
# Overlay over configs/run6_target.yaml (Arm B: teaching is the arm the
# shared LR must serve; Arm A is floor-bound and gets its like-for-like
# check from open2_a_ref.yaml once the winner is pinned):
#     python train_target.py --config configs/run6_target.yaml \
#         --override configs/pilot/target_sweep_lr3e-4.yaml \
#         --init-from $GEODE_STORE/runs/evt-run4-armB-inst/model --confirm-cost
# B @ the 50K frozen-order prefix (= the open2_n50k grid point). Winner =
# lowest min_val_nats among runs with stop_reason=converged; the pin lands
# in run5/run6_target.yaml (one shared LR — arms may differ only in the
# parent), then the OPEN(2) grid runs.
run_id: evt-sweep-target-lr3e-4
experiment:
  match_data_order_with: null  # G7 binds the production pair, not sweeps
data:
  n_examples: 50000            # prefix of the frozen order
train:
  lr: 3.0e-4
  snapshots:
    n: 4                       # disposable sweep run — minimal schedule
