# Pilot override for run 1 (spec 02 §11): tiny end-to-end de-risk pass.
# Inherits run1_pretrain.yaml; keys here win. Uploads go to the -pilot
# HF repo, never the production one.
# 2026-07-18: the model-block override is gone — the production arch is
# now pilot-sized itself, so the pilot exercises the exact production
# config and only shrinks data/steps.

run_id: evt-pilot-run1-base

data:
  # seq_len deliberately NOT overridden (2026-07-18): the pilot packs at
  # the production 512 so it exercises the exact production path.
  max_documents: 20000      # subset of TinyStories for the pilot
  val_fraction: 0.02

train:
  lr: 3.0e-4
  batch_size: 32
  eval_every: 100
  max_steps: 2000
  stopping:
    eps_nats: 0.01
    k: 3
