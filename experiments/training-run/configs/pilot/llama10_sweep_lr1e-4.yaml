# Llama TARGET LR sweep @ 1e-4 — this file carries the sweep design; the
# other three points differ only in run_id and train.lr.
#
# WHAT THIS BUYS (owner, read before approving): it discharges the
# pre-registered caveat in run10_llama1b_target.yaml header note 3 — that
# 1e-3 is borrowed from a target-stage sweep on the 38.7M model and sits
# 2.8x above the paper's 1B-tuned 3.53e-4. It does NOT change the
# external-validity claim: run 10-v2 already shows elicitation reproduces
# on a real 1.24B pretrained model (0.2969 -> 0.9883 zero-shot EM), and
# with no teach counterpart there is no EDL ratio for a lower floor to
# sharpen. This sweep buys a discharged caveat, not a new result.
#
# GRID {1e-4, 3e-4, 1e-3, 3e-3}. 3e-4 is the nearest point to the paper's
# 3.53e-4 (tuned AT 1B, back in scope here — the custom-model runs voided
# it only for the 38.7M downscale). The incumbent 1e-3 is bracketed on
# BOTH sides deliberately: an incumbent at a grid edge cannot be shown to
# be a peak (decisions.md 2026-07-25, "nulls need bracketing").
#
# SCALE: the full 1M, NOT the 100K prefix the 2026-07-24 design used.
# Measured throughput on this box is 0.249 s/step (run 10-v2, 5,500 steps
# in 0.38 h; run 10 v1 agrees at 0.244), so a production-scale point costs
# ~23 min and the 100K cost control buys nothing. Running at production
# scale removes the cross-n extrapolation caveat that qualified the arm-A
# tie-break ("that comparison extrapolates across n", 100K vs 1M).
#
# SEED 317, not the production 316. This makes the 1e-3 point a seed twin
# of run 10-v2 at identical settings. That twin is ONE paired
# observation, not a variance estimate — n=2 has no spread — but it is
# the only handle we have on whether the gaps between grid points are
# bigger than run-to-run noise.
#
# MAX_STEPS 24,000 (~4.4x run 10-v2's 5,500), overriding the inherited
# 46,878 cost ceiling. Sized so 3e-4 gets a fair shot (a ~3.3x lower lr
# plausibly wants ~3x the steps); 1e-4 is expected to hit it, and that is
# reported as a fact about 1e-4, not scored as a loss.
#
# READING RULES — pre-registered, fixed before launch:
#   1. Winner = lowest min_val_nats among points that BOTH converged and
#      are not flagged as plateaus (rule 2). Ties -> the incumbent.
#   2. PLATEAU, NOT FLOOR. stop_reason=converged does not mean "reached
#      its floor": eps/k (eps_nats 0.002, k=5 -> 2,500 flat steps) fires
#      on any flat stretch. Precedent: the 1M sweep's 1e-2 point
#      "converged" at 1.867 nats. Any point that converges at min_val >
#      2x the incumbent's 0.01323 is recorded as a plateau and cannot win.
#   3. stop_reason=max_steps is reported as "did not converge within
#      24,000 steps" and EXCLUDED from the ranking — not ranked last.
#   4. Record per point the total val-loss decrease over the final k=5
#      evals (2,500 steps). This is what separates rule 2 from rule 3;
#      the curve is already logged, so it costs nothing.
#   5. EDGE WIN EXTENDS. 3e-3 wins -> add 1e-2; 1e-4 wins -> add 3e-5.
#      Pin only from a non-edge winner.
#   6. INCONCLUSIVE BEATS A CLOSE CALL. If the best point's margin over
#      the incumbent is smaller than |twin - run10v2| (rule: seed 317's
#      1e-3 vs run 10-v2's 0.01323), the sweep cannot separate lr from
#      seed and the 1e-3 pin STANDS.
#   7. WHAT GETS REPORTED. If 1e-3 wins, the reported number stays run
#      10-v2's 0.01323 at the production seed — NOT whichever of the two
#      1e-3 runs came out lower. Selecting the minimum of two runs is
#      tuning the measurement, and min_val IS the EDL numerator.
#   8. NO SWEEP POINT IS PROMOTED. If a non-1e-3 point wins, production
#      re-runs at that lr with the production seed 316 under a new
#      run_id, and THAT run's min_val is reported. A sweep point's
#      min_val is a selected minimum and is biased low by construction.
#
# PARENT: run 9-v2's merged checkpoint, NEVER v1's — v1's parent had its
# arithmetic destroyed by the installer lr (0.0000 vs base 0.3271), which
# is what made run 10 v1 measure teaching. Launch from scripts/:
#     python3 train_target.py --config ../configs/run10_llama1b_target.yaml \
#         --override ../configs/pilot/llama10_sweep_lr1e-4.yaml \
#         --init-from $GEODE_STORE/runs/evt-run9-llama1b-inst-v2/model_merged \
#         --confirm-cost
# Delete each point's checkpoint once its min_val is read (33 GB free at
# 90% used); the eval_log and manifest are what the sweep needs to keep.
# Outcome lands in run10_llama1b_target.yaml + lr_pin.yaml + decisions.md.
run_id: evt-run10-sweep-lr1e-4
experiment:
  match_data_order_with: null
train:
  lr: 1.0e-4
  max_steps: 24000             # see MAX_STEPS above
  seed: 317                    # production is 316 — see SEED above
  snapshots:
    n: 0                       # disposable point; run 10 stores none either
