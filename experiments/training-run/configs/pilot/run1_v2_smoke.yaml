# Run-1 v2 schedule smoke: de-risk the new cosine code path on the box
# before the ~$0.55 production retrain (~$0.01). NOT a hyperparameter
# pilot — a short horizon says nothing about the 17k-step endgame. Pass
# criteria, checked by eye on the box:
#   - train_log.jsonl lr column: starts at exactly 1e-3, ends at exactly
#     1e-4, strictly falling in between (cosine over the 300-step horizon)
#   - stop_reason "max_steps" at final_step 300
#   - training_meta.json config echoes lr_schedule: cosine, min_lr: 1e-4
#   - throughput comparable to the sweep runs (schedule adds no cost)

run_id: evt-pilot-run1-v2-smoke

train:
  max_steps: 300
  eval_every: 100

cost:
  assumed_epochs_for_estimate: 0.037   # 300 steps x 128 x 512 ~= 20M of 532M tokens
