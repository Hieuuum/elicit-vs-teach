# teach-FT CONTINUATION (teach4m program, stage 11, 2026-09-10): resume
# evt-ts1b-teach-ft-n4000000 from its final checkpoint and train UNTIL the
# validation-convergence rule fires (it never did in the first run — that run
# hit its 2-pass ceiling with validation loss still falling, so 0.771 EM is a
# floor on full-FT teaching, not its endpoint). Same recipe (lr 2e-5, batch
# 128, eps/k 0.002/5, same 4M file, same 0.1% val carve, same data seed 316);
# batch-order seed 317 so the continuation does not replay the first pass;
# ceiling 4 more passes. Caveat: train_sft.py saves weights only, so the
# AdamW moments restart from zero at the continuation boundary.
#
# --init-from runs/evt-ts1b-teach-ft-n4000000/model (the launcher does this).
run_id: evt-ts1b-teach-ft-n4000000-cont
experiment:
  name: training-run
  arm: ts1b
  role: teach_full_ft_cont       # continuation of evt-ts1b-teach-ft-n4000000 to convergence
  parent_run_id: evt-ts1b-teach-ft-n4000000
  parent_required_gates: []

model:                           # must match the parent checkpoint
  hidden_size: 2048
  num_hidden_layers: 16

tokenizer:
  path: meta-llama/Llama-3.2-1B

task:
  name: arith_bare_addsub
  format_version: v1

data:
  hf_id: mhieuuu/elicit-vs-teach-arith   # manifest name only; the file is LOCAL-ONLY
  file: D_algo_bare_4m.parquet
  order_hash: b05a65dfe217a9018997f61b31e2982a883ebd46b1789c8a8a1e2b6382fd98ff
  local_path: experiments/training-run/data/full/D_algo_bare_4m.parquet
  val_fraction: 0.001            # 4,000 held-out rows for the eps/k rule (G5 uses D_algo_eval_bare)
  seed: 316

train:
  lr: 2.0e-5                     # paper Table 3 full-FT pin (same as the symbol install)
  batch_size: 128
  eval_every: 500
  max_steps: 125000              # ceiling: 4 more passes (31,218 steps each)
  stopping:                      # val-loss eps/k convergence, active from the first eval
    eps_nats: 0.002
    k: 5
    min_steps: 0
  precision: bf16
  seed: 317                      # different batch order than the first two passes
  epochs_total_planned: 4

cost:
  assumed_epochs_for_estimate: 4
