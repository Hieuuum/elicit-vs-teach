# Llama-3.2-1B Figure-2 dataset-size sweep, BARE-FORMAT family (fig2nl3) —
# ARM B: WITH format installer. Base Llama -> evt-llama-fig2nl3-installer
# (16-example correct-label BARE-NL mult format install, the fig2nl2-winning
# dose16 recipe re-rendered scaffold-free — see llama_fig2nl3_installer.yaml)
# -> target task, on D_algo_bare. BASE config for 19 sizes
# (configs/sweeps/llama_fig2nl3/llama_fig2nl3_inst_n<size>.yaml overlays);
# never launched standalone.
#
# Differs from llama_fig2nl3_noinst.yaml ONLY in the parent. This arm is the
# family's PREDICTION: with the scaffold gone the base model has a real
# format transient (premise-guard-verified ~0% zero-shot), the installer
# removes it, and the paper's Figure-2 gap — pre-elicit well BELOW base at
# small n — should finally appear. If it does not, with the premise verified
# and both parent gates recorded passes, that is a genuine discrepancy with
# the paper, not an artifact of our design.
#
# parent_required_gates lists BOTH G4 (>= 0.90 on BARE eval prompts — base
# scores ~0 there, so this is the full install) and G2 (>= 0.31 retention on
# the SCAFFOLDED eval_algo set, base 0.3271 — the pre-existing capability
# must survive). require_parent_ready (V0.6) refuses every inst run unless
# both verdicts are recorded passes.
#
# The parent is the installer's MERGED checkpoint (runs/
# evt-llama-fig2nl3-installer/model_merged/, written by merge_adapter.py),
# never its wrapped model/ (2026-07-22 incident; specs/00 V0.9).
run_id: evt-llama-fig2nl3-inst
experiment:
  name: training-run
  arm: llama                     # external-validity chain (regime "unknown")
  role: target
  parent_run_id: evt-llama-fig2nl3-installer   # the bare-dose16 installer
  external_base: null
  parent_required_gates: [G4, G2]
  match_data_order_with: null    # placeholder; every overlay points this at
                                 # the SAME-SIZE noinst run (G7)

model:                           # must match the merged parent checkpoint
  hidden_size: 2048
  num_hidden_layers: 16

tokenizer:
  path: meta-llama/Llama-3.2-1B

task:
  name: arith_bare_addsub
  format_version: v1

data:                            # identical to the no-inst arm
  hf_id: mhieuuu/elicit-vs-teach-arith
  file: D_algo_bare.parquet
  order_hash: 946b5d02a8f9260fec00ce68a4db42a12f16966f6b49f685269382ae7b4b6ace
  local_path: experiments/training-run/data/full/D_algo_bare.parquet
  n_examples: 1000000            # placeholder; every overlay sets its own
                                 # prefix of the frozen order
  eval_file: D_algo_eval_bare.parquet
  eval_order_hash: e419baa213bbe07dfeb50f46fe17b464056cd18c2a7302238a66682d7c594631
  eval_local_path: experiments/training-run/data/full/D_algo_eval_bare.parquet
  seed: 316

lora:
  r: 512                         # MATCHED to the no-inst arm and the installer
  alpha: 32

train:
  lr: 3.53e-4                    # MATCHED to the no-inst arm (paper's 1B pin)
  precision: bf16
  batch_size: 128
  eval_every: 500                # placeholder; overlays set the per-size ee
  max_steps: 93756               # placeholder; overlays set per-size ceilings
  stopping:
    eps_nats: 0.002              # MATCHED to the no-inst arm
    k: 5
    min_steps: 0
  snapshots:
    n: 0
    dense_until: 30
  seed: 316
