# elicit-FT ENDPOINT (teach4m program, stage 6, 2026-09-10): the LATENT parent
# (TS1B-latent, evt-ts1b-op-bridge-mix) FULLY fine-tuned on the NL add/sub
# target with exactly the teach-FT recipe (configs/ts1b_teach_ft.yaml): same
# 4M file, lr 2e-5, batch 128, seed 316, eval cadence, two-pass ceiling.
#
# Why: the teach-FT endpoint changed LoRA -> full FT on the teach side only,
# so every FT-teach vs LoRA-elicit comparison confounds regime with method.
# This run completes the 2x2 (regime x method): both regimes exist under both
# methods. One deliberate difference from teach-FT: stopping.min_steps 0 —
# elicitation converges in a fraction of a pass and a forced full pass would
# only add drift; the eps/k rule decides, as in every elicit run of the sweep.
#
# Trainer: train_sft.py (full config). No prequential / gradstats / snapshots
# (see ts1b_teach_ft.yaml). Do NOT prune this run's model.safetensors.
run_id: evt-ts1b-elicit-ft-n4000000
experiment:
  name: training-run
  arm: ts1b
  role: elicit_full_ft           # latent parent -> target task, full FT (elicit arm, FT variant)
  parent_run_id: evt-ts1b-op-bridge-mix
  parent_required_gates: []

model:                           # must match the parent checkpoint
  hidden_size: 2048
  num_hidden_layers: 16

tokenizer:
  path: meta-llama/Llama-3.2-1B

task:
  name: arith_bare_addsub
  format_version: v1

data:
  hf_id: mhieuuu/elicit-vs-teach-arith   # manifest name only; the file is LOCAL-ONLY
  file: D_algo_bare_4m.parquet
  order_hash: b05a65dfe217a9018997f61b31e2982a883ebd46b1789c8a8a1e2b6382fd98ff
  local_path: experiments/training-run/data/full/D_algo_bare_4m.parquet
  val_fraction: 0.001            # 4,000 held-out rows for the eps/k rule (G5 uses D_algo_eval_bare)
  seed: 316

train:
  lr: 2.0e-5                     # paper Table 3 full-FT pin (same as teach-FT and the symbol install)
  batch_size: 128
  eval_every: 500
  max_steps: 62500               # same ceiling as teach-FT (2 passes over 3,996,000 rows)
  stopping:                      # val-loss eps/k convergence from the start (elicit runs' rule)
    eps_nats: 0.002
    k: 5
    min_steps: 0
  precision: bf16
  seed: 316
  epochs_total_planned: 2

cost:
  assumed_epochs_for_estimate: 1
