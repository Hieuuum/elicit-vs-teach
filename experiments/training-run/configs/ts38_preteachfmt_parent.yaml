# ts38pf Stage 0 — pre-teach-FORMAT parent (EXPERIMENTS §6.16, decisions.md
# 2026-08-15 "ts38pf pre-registration").
#
# Why. The base (teach) arm's EDL/D-vs-n curve doesn't show the paper's
# clean "up-then-down" teaching hump; its argmax sits at or below the
# smallest grid point (n=1000). Paper App. E.1.2 (TinyStories-1B pre-teach
# FORMAT) isolates exactly this: fine-tune on the target's arithmetic
# domain, operator-notation scaffold, with labels RANDOMLY PERMUTED
# (incorrect) — "This teaches: Numerical digits (0-9)... Output format
# (respond with only the numerical answer). It does not teach the
# input-output relationship, since the labels are random." Removing this
# format-learning transient before the real (correct-label) target run is
# meant to reveal the increasing-returns (teaching) phase, if it exists on
# our grid.
#
# Data: datagen/make_preteach_format.py derives D_preteachfmt.parquet from
# the frozen D_algo's first 21,544 rows (same operand/op distribution the
# real target already trains on) — same triples, re-rendered
# fmt="operator" (`Question: 23 + 45\nAnswer: <label>`, the App. E.1.2
# scaffold, format-MISMATCHED from the bare-NL target on purpose — the
# paper's literal choice), labels replaced by
# geode.arith.permute_labels(true_answers, seed=20260717) — a fixed
# permutation, individually wrong up to chance collision (measured: 3/21544
# = 0.014%), exact same label multiset by construction (V5.64).
#
# THE `lora:` BLOCK BELOW IS LOAD-BEARING, same mechanism as
# ts38mw_pretaught_parent_lora.yaml (train_sft.py's own_lora_block() gates
# training.method on THIS file's own un-merged `lora:` key). Removing it
# would silently turn this into a full-FT run. Only r/alpha are set (128/32,
# identical to common.yaml's values); target_modules/dropout/scaling/init
# inherit from common.yaml via deep_merge.
#
# `train.stopping.min_steps: 167` is NOT a grace period — it is exactly one
# full epoch under train_sft.py's own step counting: n_val =
# round(0.005*21544) = 108 (geode.train.packing.split_indices), n_train =
# 21436, steps_per_epoch = n_train // 128 = 167 (floor/drop-last, this
# trainer's own convention — NOT train_target.py's ceil/no-drop-last one).
# Pinned deliberately (not left near-zero): on permuted labels there is no
# learnable input-output mapping, so val loss can plateau in a handful of
# evals from format acquisition alone: eps/k must not be allowed to declare
# "converged" before the model has even seen the full set once. max_steps
# is a 20-epoch ceiling (this repo's "ceilings never bind" convention,
# [[feedback-run-until-convergence]]) — stop_reason=max_steps stays a bug
# signal to inspect, not a pass.
#
# model/tokenizer blocks are IDENTICAL to every other ts38(*) parent config
# (same base checkpoint evt-run1-base-v3-ext, same frozen tokenizer).
run_id: evt-ts38pf-preteachfmt-parent
experiment:
  name: training-run
  arm: A                       # ARM_REGIME["A"] == "elicit" (train_target.py);
                                # unused by train_sft.py (hardcodes regime:
                                # "unknown"), kept for consistency with the
                                # other ts38(*) parent configs.
  role: pre_teach
  parent_run_id: evt-run1-base-v3-ext  # TinyStories 38.7M floor-1, min_val 1.0718
  parent_required_gates: []    # run 1 carries no required gates (G0 removed
                                # 2026-07-20, spec 02 §8) — the launcher's
                                # status: complete check is the only bar.

model:                         # must match the parent checkpoint (launcher guards)
  hidden_size: 512
  num_hidden_layers: 8

tokenizer:
  path: ../tokenizer            # frozen 2026-07-18; same artifact as the whole chain

task:
  name: arith_op_preteachfmt    # metadata for the masking hash; free-form
                                 # (geode.edl.masking.TaskFormat consults no
                                 # registry — checked 2026-08-15)
  format_version: v1            # for label_mask + masking_config_hash

data:
  hf_id: mhieuuu/elicit-vs-teach-arith
  file: D_preteachfmt.parquet   # 21,544 rows, operator-notation, permuted
                                 # (wrong) labels, derived from D_algo
                                 # (make_preteach_format.py)
  order_hash: 5b0b19a4c47375a4ada17cb1ee21292475b6ecaed22b2ef07aa560cf557b1bc1
  local_path: experiments/training-run/data/full/D_preteachfmt.parquet
  val_fraction: 0.005            # 108 held-out (run-2 convention); questions
                                  # are the D_algo prefix's own unique rows,
                                  # so the split cannot leak
  seed: 316

lora:                           # LOAD-BEARING — see header. r/alpha only;
  r: 128                        # target_modules/dropout/scaling inherit from
  alpha: 32                     # common.yaml via deep_merge.

train:
  lr: 1.0e-3                   # every other LoRA r128/alpha32 stage in this
                                # family already uses this value; format
                                # acquisition is a low-capacity objective,
                                # no LR sweep run for it.
  batch_size: 128
  eval_every: 25                # matches ts38_base.yaml's own n=21544
                                 # overlay cadence.
  max_steps: 3340               # 20-epoch ceiling (167 steps/epoch); never
                                 # a planned stop — see header.
  stopping:                    # loss branch (no `metric`) — plain val-loss
                                # eps/k convergence.
    eps_nats: 0.002
    k: 5
    min_steps: 167              # exactly one full epoch — see header.
  precision: bf16
  seed: 316
  epochs_total_planned: 20     # ceiling metadata; = max_steps/steps_per_epoch

cost:
  assumed_epochs_for_estimate: 20  # quote the ceiling (worst case), not the
                                    # expected stop — run-2 convention
