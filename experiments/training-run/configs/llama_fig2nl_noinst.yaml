# Llama-3.2-1B Figure-2 dataset-size sweep, NL-TARGET family — ARM A: NO
# format installer. Base Llama -> target task directly, on D_algo
# (NATURAL-LANGUAGE add/sub). This is the BASE config for 19 log-spaced
# prefix-nested sizes (configs/sweeps/llama_fig2nl/llama_fig2nl_noinst_n<size>
# .yaml overlays set run_id/n_examples/eval_every/max_steps per size); this
# file is never launched standalone.
#
# What changed from the shipped op-notation family (configs/archive/runs/
# llama_fig2_noinst.yaml), owner decisions 2026-08-03:
#   * TARGET TASK: arith_nl_addsub on D_algo, not arith_op_addsub on D_target.
#     Same frozen 1M artifact runs 2/3 taught the 38.7M model and
#     eval_algo_data_llama.yaml scores for retention — but here it is the thing
#     being LEARNED. That is what makes this a replication of the paper's
#     Figure 2 (a target task the base model already has real prior mass on)
#     rather than a from-scratch notation.
#   * EVAL: the NEW question-disjoint D_algo_eval.parquet, never D_algo itself
#     (matched-input guard). D_target_eval is the wrong format here.
#   * LoRA r=512 (the paper's fig-2 adapter class), up from r=64.
#   * Per-size max_steps ceilings DOUBLED (rationale below).
# Everything else is HELD from the shipped family: lr 3.53e-4, batch 128, bf16,
# ε/k 0.002/5 with min_steps 0, snapshots.n 0, seed 316.
#
# UNLIKE llama_probe100k_noinst.yaml, this IS the EDL measurement (not a
# learning-curve probe): each size trains fresh from base Llama to VAL
# CONVERGENCE via the loss ε/k rule (stopping block below — min_steps 0, no
# `metric` key). eval_every is the SMALL per-size value that feeds the ε/k
# tracker; max_steps is a pure cost ceiling — stop_reason=max_steps remains a
# bug signal, never an expected outcome (opposite of the probe100k pair).
#
# MAX_STEPS DOUBLED — stated once here; llama_fig2nl_inst.yaml and all 38
# overlays inherit this rationale rather than repeating it. Every per-size
# ceiling in configs/sweeps/llama_fig2nl/ is exactly 2x the same-n ceiling of
# the shipped op family, at the SAME eval_every. Three reasons: (1) n=68129
# reached ~85% of its old ceiling in the shipped sweep — far too close for a
# cap that is supposed to never bind; (2) that size's old ceiling was
# anomalously BELOW n=46416's, so the old schedule was not monotone in n and
# the tightest point was not the largest; (3) r512 changes the per-step
# optimization, so old step counts do not transfer. Ceilings are pure COST
# CAPS: doubling one costs nothing unless a run actually needs the steps, and
# stop_reason=max_steps stays a BUG SIGNAL to investigate, never a schedule
# target.
#
# EFFECTIVE-BATCH DEVIATION FROM THE PAPER (owner-accepted 2026-08-03): the
# paper optimizes at effective batch 1024 (8xH100 with accumulation); this
# family runs a single GPU at local batch 128 with NO gradient accumulation,
# while taking the paper's LR unchanged. So 3.53e-4 is ~8x hotter PER EXAMPLE
# than the optimization it was tuned in. Accepted as-is — both arms carry the
# identical deviation, so the elicit-vs-teach comparison is unaffected — but do
# NOT quote step counts or LR sensitivity against the paper's as if matched.
#
# Paired with llama_fig2nl_inst.yaml (installer arm); the two differ ONLY in
# the parent (raw Llama here vs the 1-example format installer there) —
# identical D_algo order/prefix/eval/seed/LR/batch, enforced per-size via G7
# (inst overlay's match_data_order_with).
#
# Defaults below (n_examples 1,000,000, eval_every 500, max_steps 93,756) are
# the LARGEST size's row (i=18) — the base file's own numbers form a complete,
# valid row so an accidental standalone launch trains the full 1M rather than
# failing on a missing key; every overlay overrides all three.
run_id: evt-llama-fig2nl-noinst
experiment:
  name: training-run
  arm: llama                     # external-validity chain (regime "unknown")
  role: target
  parent_run_id: null            # no zoo parent — base is a gated hub model
  external_base: meta-llama/Llama-3.2-1B   # base, NOT Instruct; skips parent-gate
  parent_required_gates: []
  match_data_order_with: null    # this arm is the reference stream; the
                                 # inst overlay for the matching size points
                                 # back at this run (G7)

model:                           # must match the hub checkpoint (vocab guarded
  hidden_size: 2048              # via len(tokenizer)=128256)
  num_hidden_layers: 16

tokenizer:
  path: meta-llama/Llama-3.2-1B  # gated; box needs HF_TOKEN with gated read

task:
  name: arith_nl_addsub          # natural-language add/sub (D_algo) — the
  format_version: v1             # TARGET task of this family

data:
  hf_id: mhieuuu/elicit-vs-teach-arith
  file: D_algo.parquet           # 1M NL add/sub, correct labels, seed 20260717.
                                 # No local_path: D_algo IS published on the
                                 # public HF repo above, so the box downloads it
                                 # (the pinned hash is verified either way).
  order_hash: 48d4feffd1e50a457d4ce59624ba507dbd60e48b9c98e842c585715ad47769c9
  n_examples: 1000000            # placeholder = largest size; every overlay
                                 # sets its own prefix of the frozen order
  eval_file: D_algo_eval.parquet # NEW 2026-08-03, question-disjoint from
                                 # D_algo; rows 0-2047 = stopping block, rows
                                 # 2048+ = reporting block (G5 + test loss)
  eval_order_hash: 5e422dafc7330a050a483002172e23b262c180ba4254b5d97e428506e6892fb3
  # eval_local_path is LOAD-BEARING, not an optimization: D_algo_eval is
  # LOCAL-ONLY (never published to the hub), so a hub fetch has nothing to fall
  # back on. train_target.py reads d.get("eval_local_path") and hands it to
  # load_frozen_parquet (V5.70), which resolves a relative path against
  # REPO_ROOT and still verifies eval_order_hash.
  eval_local_path: experiments/training-run/data/full/D_algo_eval.parquet
  seed: 316

lora:
  r: 512                         # paper's fig-2 adapter class (overrides
  alpha: 32                      # common.yaml r=128); dropout 0, QKVOGUD, init
                                 # from common.yaml

train:
  lr: 3.53e-4                    # paper's 1B pin (owner 2026-07-30, no sweep);
                                 # see the effective-batch note in the header.
                                 # Dot-mantissa form is mandatory — a bare
                                 # `3.53e-4` without the dot parses as a STRING
                                 # under YAML 1.1 and register_run refuses it
  precision: bf16                # update forward autocast; measurement stays fp32
  batch_size: 128                # local batch, no accumulation (header)
  eval_every: 500                # placeholder = largest size's cadence; every
                                 # overlay sets the per-size ee (5-500) that
                                 # feeds the ε/k tracker
  max_steps: 93756               # placeholder = largest size's ceiling (2x the
                                 # shipped family's 46878); every overlay sets
                                 # its own per-size ceiling
  stopping:                      # loss branch of the V0.7 union (no `metric`):
    eps_nats: 0.002              # canonical loss rule (owner 2026-07-22,
    k: 5                         # spec 02 §6) — same as run 10 / the shipped
    min_steps: 0                 # fig-2 family, NOT the probe100k pair's
                                 # min_steps==max_steps suppression (this run
                                 # converges for real)
  snapshots:
    n: 0                         # no extraction dumps; behavioral EDL only
    dense_until: 30              # unused when n:0 (kept for parity)
  seed: 316
