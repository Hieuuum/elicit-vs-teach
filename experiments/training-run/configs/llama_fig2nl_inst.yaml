# Llama-3.2-1B Figure-2 dataset-size sweep, NL-TARGET family — ARM B: WITH
# format installer. Base Llama -> evt-llama-fig2nl-installer (1-example
# correct-label OPERATOR-notation mult format install, see
# llama_fig2nl_installer.yaml — the dose deliberately shares only the bare-
# numeral output convention with this NL target) -> target task, on D_algo
# (natural-language add/sub). BASE config for 19 log-spaced prefix-nested sizes
# (configs/sweeps/llama_fig2nl/llama_fig2nl_inst_n<size>.yaml overlays set
# run_id/n_examples/eval_every/max_steps/match_data_order_with per size); this
# file is never launched standalone.
#
# See llama_fig2nl_noinst.yaml's header for the shared framing — the NL target
# protocol, the doubled per-size max_steps ceilings, the effective-batch
# deviation from the paper, and why this is a real EDL measurement rather than
# a probe100k-style one-pass curve. This file differs from it ONLY in the
# parent.
#
# The parent is the installer's MERGED checkpoint (runs/
# evt-llama-fig2nl-installer/model_merged/, written by scripts/
# merge_adapter.py), never its wrapped model/ — train_target.py's --init-from
# is a plain from_pretrained, which on a wrapped base+A/B state dict silently
# random-inits every projection (2026-07-22 G5 incident; specs/00 V0.9).
run_id: evt-llama-fig2nl-inst
experiment:
  name: training-run
  arm: llama                     # external-validity chain (regime "unknown")
  role: target
  parent_run_id: evt-llama-fig2nl-installer   # the format installer
  external_base: null
  parent_required_gates: [G4, G2]  # G4 format >=0.90 on NL prompts, G2
                                   # retention >=0.31 (RAISED from the shipped
                                   # family's 0.29: NL add/sub is now the
                                   # target task itself), owner 2026-08-03
  match_data_order_with: null    # placeholder; every overlay points this at
                                 # the SAME-SIZE noinst run (G7): identical
                                 # stream by construction, checked as a guard

model:                           # must match the merged parent checkpoint
  hidden_size: 2048
  num_hidden_layers: 16

tokenizer:
  path: meta-llama/Llama-3.2-1B

task:
  name: arith_nl_addsub
  format_version: v1

data:                            # identical to the no-inst arm
  hf_id: mhieuuu/elicit-vs-teach-arith
  file: D_algo.parquet           # public HF repo, no local_path needed
  order_hash: 48d4feffd1e50a457d4ce59624ba507dbd60e48b9c98e842c585715ad47769c9
  n_examples: 1000000            # placeholder = largest size; every overlay
                                 # sets its own prefix of the frozen order
  eval_file: D_algo_eval.parquet # question-disjoint from D_algo; rows 0-2047
                                 # stopping block, 2048+ reporting block
  eval_order_hash: 5e422dafc7330a050a483002172e23b262c180ba4254b5d97e428506e6892fb3
  # LOAD-BEARING: D_algo_eval is local-only, never on the hub (see the no-inst
  # arm's header note); resolved against REPO_ROOT, hash still verified.
  eval_local_path: experiments/training-run/data/full/D_algo_eval.parquet
  seed: 316

lora:
  r: 512                         # paper's fig-2 adapter class, MATCHED to the
  alpha: 32                      # no-inst arm and to the installer

train:
  lr: 3.53e-4                    # MATCHED to the no-inst arm (paper's 1B pin)
  precision: bf16
  batch_size: 128
  eval_every: 500                # placeholder = largest size's cadence; every
                                 # overlay sets the per-size ee (5-500)
  max_steps: 93756               # placeholder = largest size's ceiling (2x the
                                 # shipped family's; rationale in the no-inst
                                 # arm's header)
  stopping:
    eps_nats: 0.002              # MATCHED to the no-inst arm (loss branch,
    k: 5                         # min_steps 0 — real convergence, not the
    min_steps: 0                 # probe100k pair's suppressed rule)
  snapshots:
    n: 0
    dense_until: 30
  seed: 316
