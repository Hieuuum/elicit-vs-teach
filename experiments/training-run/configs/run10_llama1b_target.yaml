# Run 10 — Llama-3.2-1B target (external-validity chain, owner 2026-07-23,
# decisions.md): operator-notation add/sub, correct labels, LoRA, full 1M.
# Mirrors runs 5/7's role on the real pretrained model: elicitation of a
# capability Llama already holds from pretraining. Trains from run 9's
# MERGED checkpoint via scripts/train_target.py through the prequential
# EDL harness — this run IS the EDL measurement (fp32 harness, no
# autocast). See run7_target_1m.yaml / run5_target.yaml for harness
# mechanics; only the Llama deltas are annotated here.
#
# BEFORE LAUNCH (owner):
#   1. evt-run9-llama1b-inst-v2 complete with G4 AND G2 recorded PASS, then
#      merged: --init-from must point at
#      .../evt-run9-llama1b-inst-v2/model_merged (plain checkpoint from
#      scripts/merge_adapter.py). NEVER the wrapped model/ dir — plain
#      from_pretrained on a wrapped checkpoint silently random-inits
#      projections (zoo.load_model rule). The -v2 parent is not cosmetic:
#      v1's parent had 0.0000 arithmetic, so run 10 v1 measured teaching.
#      parent_run_id AND --init-from must BOTH name -v2, or this run
#      silently retrains on the destroyed parent and reproduces v1.
#   2. Smoke first: pilot/llama10_smoke.yaml — the harness at 1.24B params,
#      batch 128 (bf16 update forward, fp32 measurement forwards — see
#      train.precision below) is the memory worst case on a 24 GB 4090; if
#      it OOMs, STOP and ask the owner (batch change = protocol change).
#   3. train.lr stays the RUNS-7/8 1M SWEEP WINNER (one LR everywhere, owner
#      2026-07-24; the Llama target sweep is dropped, pilot/llama10_sweep_lr*
#      .yaml deleted 2026-07-24, in git history). This is the right STAGE of
#      evidence (a target-stage sweep) but the wrong MODEL — 38.7M, not
#      1.24B Llama — so it is borrowed, not validated here. Accepted
#      trade-off: it sits 2.8x above the paper's 1B-tuned 3.53e-4, shifting
#      EDL magnitude. Pre-registered test (2026-07-25): if this run's
#      min_val does not fall from v1's 0.0156 toward run 7's 0.0027, the
#      borrowed pin is suspect and the Llama target sweep gets revived
#      (5 points, ~2.5 h, ~$1). Do not tune lr on min_val ad hoc — min_val
#      IS the EDL numerator; only a pre-registered sweep may touch it.
#   4. Disk: NO snapshots (owner 2026-07-24, see train.snapshots) — this
#      run stores its final wrapped checkpoint (~5 GB) plus logs; budget
#      ~15 GB, not the old ~190 GB snapshot plan.
#   5. Evidence pre-launch (recorded, not gating): zero-shot op add/sub
#      on the merged parent — real Llama may already answer op-notation
#      add/sub; a near-zero EDL elicitation would itself be the expected
#      finding, record it, don't "fix" it.
run_id: evt-run10-llama1b-target-v2
experiment:
  name: training-run
  arm: llama                   # external-validity chain (not A/B)
  role: target
  parent_run_id: evt-run9-llama1b-inst-v2
  parent_required_gates: [G4, G2]
                               # G4 = format installed. G2 = RETENTION, added
                               # 2026-07-25 and now GATING: v1 shipped with
                               # "retention evidence is recorded but not
                               # gating", and that hole is exactly what let a
                               # parent with 0.0000 arithmetic through. This
                               # run only means "elicitation" if its parent
                               # still HAS the capability, so the guard
                               # belongs in the DAG, not in a comment. Score
                               # G2 on the parent with --threshold 0.29
                               # (90% of base Llama's 0.3271) — the 0.95 G1/G2
                               # bar does not apply to a never-taught model.
  match_data_order_with: null  # G7 binds the A/B pair; this run's stream is
                               # identical by construction anyway (same frozen
                               # file, order_hash, n, seed)

model:                         # must match the merged parent checkpoint
  hidden_size: 2048            # (launcher guards vocab via len(tokenizer),
  num_hidden_layers: 16        # hidden, layers)

tokenizer:
  path: meta-llama/Llama-3.2-1B  # hub id; verify_llama_tokenizer.py must
                                 # have passed before any launch

task:
  name: arith_op_addsub        # operator-notation add/sub (D_target); TaskFormat
  format_version: v1           # for label_mask + masking_config_hash

data:                          # same frozen artifacts + pins as runs 7/8
  hf_id: mhieuuu/elicit-vs-teach-arith
  file: D_target.parquet       # 1M op-notation add/sub, correct labels, seed 20260717
  order_hash: 69e3b09e2dd599e4ad8948fe2a5a19e67989be51bc006e8d4e220818ce16d0f7
  n_examples: 1000000          # full 1M, matching runs 7/8 (owner 2026-07-23)
  eval_file: D_target_eval.parquet
  eval_order_hash: 588da81e0c016b8f0b3575a3aa7ad9b8e4c4421352a46fb4a30cd9ac713f6cb8
  seed: 316                    # single-seed convention; same stream as runs 7/8

lora:
  r: 64                        # the pre-downscale 1B pin (common.yaml note:
                               # "was 64 at 1B scale"); overrides common.yaml's
                               # r=128 (a 38.7M-scale decision)
  alpha: 32                    # scaling α/2r = 0.25; dropout 0, targets
                               # QKVOGUD; adapter init seed = train.seed

train:
  lr: 1.0e-3                   # PINNED 2026-07-24 (one LR everywhere; Arm-A
                               # tie-break, lr_pin.yaml + decisions.md);
                               # 2.8x the paper's 1B pin 3.53e-4
  precision: bf16              # owner 2026-07-24: the Llama chain trains
                               # bf16, matching run 9's installer. Autocast
                               # wraps ONLY the harness's update forward
                               # (V5.62): the prequential stream, stopping
                               # evals, and θ_T test loss stay fp32 — bf16
                               # moves the θ trajectory, never how a loss is
                               # measured. All-fp32 at 1.24B/batch 128 was
                               # the 24 GB OOM worst case (header note 2).
  batch_size: 128
  eval_every: 500              # loss-rule cadence (runs-5/6 rule, spec 02 §6)
  max_steps: 46878             # pure cost ceiling = 6 epochs of the full 1M
                               # at batch 128, matching runs 7/8. An elicited
                               # arm is expected to stop far earlier; the ε/k
                               # rule is the planned stop —
                               # stop_reason=max_steps means "did not
                               # converge": investigate, don't ship
  stopping:                    # loss branch of the V0.7 union (no `metric`):
    eps_nats: 0.002            # canonical loss rule at short-run cadence
    k: 5                       # (owner 2026-07-22, spec 02 §6, ratified for
    min_steps: 0               # the runs-5/6 family) — inherited BY
                               # CITATION, not silently
  snapshots:
    n: 0                       # owner 2026-07-24: NO snapshots for the Llama
    dense_until: 30            # chain — no extraction is planned here (the
                               # external-validity claim is behavioral EDL);
                               # closes the open "pick n at box sizing" item
                               # (was 1024 ≈ 180 MB × up to 1024 + 5 GB base).
                               # The EDL stream + val curve are unaffected:
                               # train_log/prequential.jsonl log every step,
                               # eval_log.jsonl gets the dense curve evals
                               # (EVAL_CURVE_N, train_target.py). Runs 7/8
                               # KEEP n=2048 — their extraction is owed.
  seed: 316

# No cost block: train_target.py quotes the max_steps ceiling directly —
# at 1.24B params the ceiling estimate is real money relative to earlier
# runs; read it before confirming.
