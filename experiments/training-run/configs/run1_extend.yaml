# Run 1 extension: continue evt-run1-base-v3 to measured convergence.
#
# v3 hit its 30k-step cost ceiling with stop_reason=max_steps (min val
# 1.1020 nats) while still descending at ~2.5-3.0 millinats per 1k steps
# — monotone through all 30 evals, no flattening. The eps/k rule fires
# only when descent drops below ~eps/k per eval (~1.7 mnat/1k), so the
# ceiling arrived before convergence; the recipe itself is on-protocol.
# This overlay warm-starts from the v3 checkpoint via --init-from (params
# only — AdamW moments do NOT carry over; expect a small transient in the
# first evals, absorbed by best-from-inf tracking) and continues under
# the IDENTICAL recipe — everything (constant lr 1e-3, eval_every 1000,
# stopping eps 0.005 / k 3) inherits from run1_pretrain.yaml — so the
# combined v3 + v3-ext trajectory is the paper's run with a bigger
# budget, not a new recipe.
#
# Sanity check on completion: min_val_nats must land BELOW v3's 1.1020.
# "Converged" within the first ~3 evals at a val above that is the
# warm-start transient plateauing, not convergence — investigate.
#
# Launch (on the box, from experiments/training-run/scripts):
#   python train.py --config ../configs/run1_pretrain.yaml \
#     --override ../configs/run1_extend.yaml \
#     --packed-cache $HOME/packed_full.pt \
#     --init-from $GEODE_STORE/runs/evt-run1-base-v3/pretrain/model \
#     --confirm-cost
run_id: evt-run1-base-v3-ext
experiment:
  parent_run_id: evt-run1-base-v3

train:
  max_steps: 20000      # cost CEILING (~$0.7), not a target. Descent rate
                        # decayed ~4.5 -> ~2.6 mnat/1k over v3's last 10k
                        # steps; reaching the ~1.7 mnat/1k firing threshold
                        # extrapolates to ~8-12k more steps, so 20k is ~2x
                        # headroom. stop_reason=max_steps here means "budget
                        # exhausted before convergence" — investigate again.

cost:
  assumed_epochs_for_estimate: 3   # confirm gate quotes >= the 20k-step
                                   # ceiling (2.5 epochs @ batch 128)
