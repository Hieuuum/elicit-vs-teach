# Run 1 extension: continue evt-run1-base-v2 to measured convergence.
#
# The v2 cosine run ended at its fixed 17k horizon (stop_reason=max_steps,
# best val 1.1140 nats) with the plateau rule inert BY DESIGN (spec 02
# §6.1: cosine decay pushes late deltas below eps, so honoring the rule
# would cut the schedule short). "Converged" was therefore never tested.
# This overlay warm-starts from the v2 checkpoint via --init-from (params
# only — AdamW moments and schedule position do NOT carry over; expect a
# small transient in the first evals, absorbed by best-from-inf tracking)
# and trains at a constant LR equal to the cosine floor, which re-arms
# the eps/k plateau rule so the run ends on measured convergence.
#
# Launch (on the box, from experiments/training-run/scripts):
#   python train.py --config configs/run1_pretrain.yaml \
#     --override configs/run1_extend.yaml \
#     --packed-cache $GEODE_STORE/packed_full.pt \
#     --init-from $GEODE_STORE/runs/evt-run1-base-v2/pretrain/model \
#     --confirm-cost
run_id: evt-run1-base-v2-ext
experiment:
  parent_run_id: evt-run1-base-v2

train:
  lr: 1.0e-4            # = v2's cosine floor: pick up where the schedule ended
  lr_schedule: constant # cosine keeps the plateau rule inert; constant re-arms it
  min_lr: null          # only meaningful with cosine (train_full raises otherwise)
  max_steps: 17000      # cost CEILING (~$0.55 again), not a target — the plateau
                        # rule should fire first. stop_reason=max_steps here means
                        # "budget exhausted before convergence", an honest signal.
  eval_every: 1000      # owner 2026-07-20: doubled from 500. eps/k was
                        # calibrated at LR 1e-3; at 1e-4 per-eval progress
                        # shrinks, so the wider window measures more progress
                        # per check instead of tripping on slow-but-real
                        # descent. Stop lag k*eval_every = 3000 steps
                        # (minutes); eval overhead halves to ~1.5%.
  # stopping (eps 0.005 / k 3) inherits from run1_pretrain.yaml — the same
  # convergence definition the sweep pinned. Same data.seed/val_fraction
  # ⇒ same val split, so best_val_nats stays directly comparable with
  # v2's 1.1140.
