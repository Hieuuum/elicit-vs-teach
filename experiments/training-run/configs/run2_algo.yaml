# Run 2 — Arm A pre-teach: NL add/sub, correct labels (spec 02 §1 row 2, §6).
# Full FT from the run-1 floor-1 checkpoint via scripts/train_sft.py.
#
# BEFORE LAUNCH (owner, after the G0 verdict):
#   1. Pin experiment.parent_run_id to the floor-1 run id
#      (evt-run1-base-v2 or evt-run1-base-v2-ext, whichever G0 is judged on).
#   2. Pin train.lr from the run-2 LR sweep (decisions.md 2026-07-20:
#      full-length sweep overlays in configs/pilot/run2_sweep_lr*.yaml,
#      then this canonical run re-launches the winner's exact config).
run_id: evt-run2-armA-algo
experiment:
  name: training-run
  arm: A
  role: pre_teach
  parent_run_id: null          # pin to the floor-1 run id after the G0 verdict
  parent_required_gates: [G0]  # launcher refuses unless recorded pass:true (V0.6)

model:                         # must match the parent checkpoint (launcher guards)
  hidden_size: 512
  num_hidden_layers: 8

tokenizer:
  path: ../tokenizer           # frozen 2026-07-18; same artifact as run 1

task:
  name: arith_nl_addsub        # TaskFormat for label_mask + masking_config_hash
  format_version: v1

data:
  hf_id: mhieuuu/elicit-vs-teach-arith
  file: D_algo.parquet         # 1M NL add/sub, correct labels, seed 20260717
  # Pinned from data/full/report.json (frozen 2026-07-19); the launcher
  # recomputes over the downloaded file and refuses on mismatch.
  order_hash: 48d4feffd1e50a457d4ce59624ba507dbd60e48b9c98e842c585715ad47769c9
  val_fraction: 0.005          # 5,000 held-out examples; questions are unique
                               # across the file, so the split cannot leak
  seed: 316

train:
  lr: 1.0e-4                   # PLACEHOLDER (paper-audit SFT starting point,
                               # decisions.md 2026-07-19) — pin from the sweep
                               # before launching this canonical run
  batch_size: 128              # spec 02 §6 fixed table; 128×33 tokens fits a
                               # 24 GB 4090 without grad accumulation
  eval_every: 500              # ~16 evals/epoch; 5,000 val examples
  max_steps: 7773              # exactly 1 epoch (spec 02 §1: 1M, 1 epoch):
                               # (1M − 5,000 val) // 128 drop-last batches.
                               # Recompute if val_fraction ever changes.
  stopping:                    # inherited convergence definition (OPEN(3),
                               # closed 2026-07-19); revisit only if the
                               # arithmetic-val curve misbehaves (spec 02 §6)
    eps_nats: 0.005
    k: 3
  precision: bf16
  seed: 316
  epochs_total_planned: 1

cost:
  assumed_epochs_for_estimate: 1
