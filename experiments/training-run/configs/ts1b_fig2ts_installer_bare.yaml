# fig2ts installer FALLBACK rung (pre-authorized, use ONLY if the primary
# ts1b_fig2ts_installer.yaml misses G4 >= 0.90 on bare prompts): the same
# E.1.2 random-label mult dose re-rendered SCAFFOLD-FREE (D_inst_bare =
# D_inst via make_bare_sets.py — same triples, same random labels, bare_nl
# framing), so the installed output convention and the target task share
# their surface form. Everything else identical to the primary. Operator
# protocol: delete the installer run dir, retrain with THIS config (it is a
# full config, not an overlay — pass it as --config), score G4+G3
# --no-record, report. A pass here vs a fail on the primary would FALSIFY
# the paper's input-format-irrelevance claim (E.1.2 p.16) on a blank model —
# report it either way.
run_id: evt-ts1b-fig2ts-installer
experiment:
  name: training-run
  arm: ts1b
  role: format_install
  parent_run_id: evt-ts1b-base
  parent_required_gates: []

model:
  hidden_size: 2048
  num_hidden_layers: 16

tokenizer:
  path: meta-llama/Llama-3.2-1B

task:
  name: arith_bare_mult        # bare-NL mult framing (D_inst_bare)
  format_version: v1

data:
  hf_id: mhieuuu/elicit-vs-teach-arith
  file: D_inst_bare.parquet    # D_inst re-rendered bare (random labels kept)
  order_hash: e87d0d6ce4543c733e79df1a68f524073ea51b1a528857edec515991b429b36e
  # LOCAL-ONLY derivation: regenerated by datagen/make_bare_sets.py
  local_path: experiments/training-run/data/full/D_inst_bare.parquet
  val_fraction: 0.005
  seed: 316

train:
  lr: 2.0e-5                   # unchanged from the primary
  batch_size: 128
  eval_every: 250
  max_steps: 15548
  stopping:
    metric: format_validity
    threshold: 0.99
    k: 3
    n_prompts: 512
    prompt_seed: 316
  precision: bf16
  seed: 316
  epochs_total_planned: 2

cost:
  assumed_epochs_for_estimate: 2
