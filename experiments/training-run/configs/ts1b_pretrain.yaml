# TinyStories-1B pretrain (fig2ts family, EXPERIMENTS §6.14) — the paper's
# "TinyStories–1B": the Llama-3.2-1B ARCHITECTURE, randomly initialized,
# pretrained exclusively on TinyStories-v2 (paper App. D p.15: "we first
# pretrain a randomly initialized Llama-3.2-1B model on ... TinyStories-v2").
# This is the missing model for Fig 2's other two curves (base ↑↓ peak
# ~300K, pre-teach format ↑↓ peak ~150K — paper Table 5, p.20).
#
# Recipe = run-1 v3's paper protocol (Table 1 p.18: AdamW 0.9/0.999, wd
# 0.01, grad clip 1.0, bf16, CONSTANT LR, stop on val-loss convergence),
# scaled to 1B. Two deliberate changes from run-1:
#   * ARCHITECTURE: exact Llama-3.2-1B dims (2048/8192/16L/32H/8KV, GQA,
#     rope_theta 500000, tied embeddings) instead of the 38.7M toy — the
#     whole point of the family; r512 LoRA capacity only means what Fig 2
#     means at this scale.
#   * TOKENIZER: meta-llama/Llama-3.2-1B (vocab 128256), not the 10K custom
#     BPE — "the Llama 3.2 1B architecture" includes its vocab, and it keeps
#     every downstream artifact (D_algo_bare, eval configs, span
#     verification, gates) byte-identical to the Llama families.
#
# LR: run-1's 1e-3 pin was measured at 38.7M and does NOT transfer on
# authority ([[feedback-scope-check-pins-before-reuse]] class). PIN AT THE
# MINI-SWEEP: run the three 2000-step rungs under configs/sweeps/ts1b/
# first (~2-3 h total), pick the lowest stable val, then launch this
# config with that LR (edit the value below before the production run;
# 5.0e-4 is the placeholder midpoint). A diverged 30-hour pretrain is the
# failure this buys out of.
#
# Cost: tokens/step = 128*512 = 65,536; TinyStories-v2 ≈ 550M Llama tokens
# → epoch ≈ 8.4K steps. Ceiling 30,000 steps ≈ 3.6 epochs ≈ 2.0e9 tokens ≈
# 1.5e19 FLOPs ≈ 25-37 h on one A100 (plateau expected earlier, run-1
# converged in ~1.3 epochs-equivalent). $0 on owner hardware.
run_id: evt-ts1b-base
experiment:
  name: training-run
  arm: ts1b                   # the TinyStories-1B chain (fig2ts)
  role: pretrain
  parent_run_id: null

model:                        # exact Llama-3.2-1B dims, random init
  hidden_size: 2048
  intermediate_size: 8192
  num_hidden_layers: 16
  num_attention_heads: 32
  num_key_value_heads: 8      # GQA, as Llama-3.2-1B ships
  rope_theta: 500000.0        # Llama-3.2's value — kept for architecture
                              # fidelity (run-1 dropped it at 38.7M; here
                              # "the Llama 3.2 1B architecture" is the spec)
  max_position_embeddings: 2048   # packing stays at data.seq_len; RoPE has
                              # no learned positions so headroom is free
  tie_word_embeddings: true   # as Llama-3.2-1B
  # vocab_size comes from the tokenizer at build time (128256)

tokenizer:
  path: meta-llama/Llama-3.2-1B   # gated; HF_TOKEN with the license accepted

data:
  hf_id: roneneldan/TinyStories
  file: TinyStoriesV2-GPT4-train.txt  # v2 ships only as this txt in the v1
                              # repo (run-1 verification, 2026-07-18)
  seq_len: 512                # run-1 pin: story p90 = 265, 1.6% exceed 512
  val_fraction: 0.005
  seed: 316

train:
  lr: 5.0e-4                  # PLACEHOLDER — pin from the ts1b LR mini-sweep
                              # before the production launch (header). Dot-
                              # mantissa form mandatory (YAML 1.1).
  batch_size: 128             # effective batch (run-1 convention)
  micro_batch_size: 8         # accumulation 16x8: fp32 logits at vocab
                              # 128256 are ~2.1 GB per micro-batch of 8 —
                              # fits a 40 GB A100 beside model + AdamW
                              # moments; on 80 GB, 16 also works
  lr_schedule: constant       # paper protocol (Table 1)
  min_lr: null
  eval_every: 1000
  max_steps: 30000            # cost CEILING (~3.6 epochs), not a target —
                              # the plateau rule should fire first;
                              # stop_reason=max_steps means "did not
                              # converge": investigate, don't ship
  stopping:                   # canonical rule (owner 2026-07-21, spec 02 §6)
    eps_nats: 0.002
    k: 5
    min_steps: 5000
  precision: bf16
  seed: 316
  epochs_total_planned: 4     # manifest metadata: the 30k ceiling ≈ 3.6
                              # epochs of ~1.07M packed train seqs

cost:
  assumed_epochs_for_estimate: 4  # quote the ceiling, not the expected plateau
