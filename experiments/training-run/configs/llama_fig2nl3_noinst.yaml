# Llama-3.2-1B Figure-2 dataset-size sweep, BARE-FORMAT family (fig2nl3) —
# ARM A: NO format installer. Base Llama -> target task directly, on
# D_algo_bare (scaffold-free NL add/sub). BASE config for 19 log-spaced
# prefix-nested sizes (configs/sweeps/llama_fig2nl3/llama_fig2nl3_noinst_n
# <size>.yaml overlays set run_id/n_examples/eval_every/max_steps per size);
# never launched standalone.
#
# WHAT CHANGED vs llama_fig2nl2_noinst.yaml — exactly one thing, the FORMAT:
# D_algo_bare / D_algo_eval_bare are the frozen D_algo / D_algo_eval
# re-rendered without the Question:/Answer: scaffold (bare_nl, spec 02 §4;
# datagen/make_bare_sets.py — same triples, same order, same question bodies,
# so G7 matching and every disjointness guarantee carry over). Rationale: the
# fig2nl2 outcome (EXPERIMENTS §6.12) measured that the scaffold pre-installs
# the output convention in both arms, voiding the paper's pre-elicit
# transient. In THIS family base Llama should enter at ~0% zero-shot (the
# launcher's premise guard verifies that BEFORE any training), so this arm
# now carries the format-learning transient the paper's Figure-2 base curve
# has — expect its small-n EDL/D to sit ABOVE fig2nl2's (the transient is
# extra information), and the inst arm to sit BELOW it if the paper's
# mechanism is real.
#
# Everything else is HELD from fig2nl2 (which held it from fig2nl): LoRA
# r512/a32 @ 3.53e-4, batch 128 no accumulation (the effective-batch
# deviation, both arms identical), bf16, seed 316, ε/k 0.002/5 min_steps 0,
# per-size doubled ceilings, snapshots n:0. Ceiling caveat: the bare arm has
# MORE to learn at small n than any prior family, so if stop_reason=max_steps
# appears at small n it is still a bug signal — investigate, don't ship.
#
# Defaults below are the LARGEST size's row (i=18); every overlay overrides.
run_id: evt-llama-fig2nl3-noinst
experiment:
  name: training-run
  arm: llama                     # external-validity chain (regime "unknown")
  role: target
  parent_run_id: null            # no zoo parent — base is a gated hub model
  external_base: meta-llama/Llama-3.2-1B   # base, NOT Instruct
  parent_required_gates: []
  match_data_order_with: null    # this arm is the reference stream; the inst
                                 # overlay for the matching size points back
                                 # at this run (G7)

model:                           # must match the hub checkpoint
  hidden_size: 2048
  num_hidden_layers: 16

tokenizer:
  path: meta-llama/Llama-3.2-1B  # gated; box needs HF_TOKEN with gated read

task:
  name: arith_bare_addsub        # scaffold-free NL add/sub (D_algo_bare) —
  format_version: v1             # the TARGET task of this family

data:
  hf_id: mhieuuu/elicit-vs-teach-arith
  file: D_algo_bare.parquet      # 1M bare NL add/sub — the frozen D_algo
                                 # re-rendered by make_bare_sets.py
  order_hash: 946b5d02a8f9260fec00ce68a4db42a12f16966f6b49f685269382ae7b4b6ace
  # LOCAL-ONLY (derived, never published): local_path is load-bearing,
  # resolved against REPO_ROOT via load_frozen_parquet (V5.70), hash verified.
  local_path: experiments/training-run/data/full/D_algo_bare.parquet
  n_examples: 1000000            # placeholder = largest size; every overlay
                                 # sets its own prefix of the frozen order
  eval_file: D_algo_eval_bare.parquet # derived from D_algo_eval (question-
                                 # disjoint); rows 0-2047 = stopping block,
                                 # 2048+ = reporting block (G5 + test loss)
  eval_order_hash: e419baa213bbe07dfeb50f46fe17b464056cd18c2a7302238a66682d7c594631
  eval_local_path: experiments/training-run/data/full/D_algo_eval_bare.parquet
  seed: 316

lora:
  r: 512                         # paper's fig-2 adapter class (overrides
  alpha: 32                      # common.yaml r=128); dropout 0, QKVOGUD

train:
  lr: 3.53e-4                    # paper's 1B pin, unchanged across families.
                                 # Dot-mantissa form is mandatory (YAML 1.1)
  precision: bf16
  batch_size: 128                # local batch, no accumulation (both arms
                                 # carry the deviation identically)
  eval_every: 500                # placeholder; every overlay sets the per-size
                                 # ee (5-500) that feeds the ε/k tracker
  max_steps: 93756               # placeholder = largest size's ceiling; every
                                 # overlay sets its own (the doubled schedule,
                                 # unchanged from fig2nl/fig2nl2)
  stopping:                      # loss branch of the V0.7 union (no `metric`):
    eps_nats: 0.002              # canonical loss rule (spec 02 §6)
    k: 5
    min_steps: 0
  snapshots:
    n: 0                         # no extraction dumps; behavioral EDL only
    dense_until: 30              # unused when n:0 (kept for parity)
  seed: 316
