# ts38mw Stage 1 — wrapper-diverse install PROBE (plan
# docs/plan-ts38mw-multiwrap-install.md, owner-drafted 2026-08-15).
#
# Why. The ts38 certified parent (evt-ts38-pretaught-parent) computes
# op-notation add/sub correctly on held-out operand pairs (96.8%), but ONLY
# under its exact training template `Question: a + b\nAnswer:` — even
# `What is a + b?` with the symbol present collapses to ~3%, and this is
# flat across snapshots 10k-24k (ruling out the stopping rule as the cause;
# see docs/ts38-vs-bits-that-count.md). The suspected cause is that the
# install set has exactly ONE surface form, ever, on a 38.7M model. This
# config installs the SAME op-notation D_target arithmetic, but under 8
# wrapper templates (deterministic `WRAPPERS[idx % 8]` assignment,
# datagen/make_multiwrap_set.py -> D_target_mw.parquet), asking whether
# surface diversity in the install makes the skill fire under a held-out
# wrapper it never saw — including the word-only target phrasing (`sumof`
# probe pin). This run is a PROBE/CURVE, never a parent — scored against the
# pre-registered GO-A/GO-B/WEAK/NO-GO/INCONCLUSIVE bands (plan §2,
# scripts/mw_verdict.py, decisions.md pre-registration), not gated into any
# downstream child. The 8 wrappers (none use a target/DM word — forbidden
# list enforced in make_multiwrap_set.py):
#   W0  Question: {a} + {b}\nAnswer: {c}   (canonical = D_target)
#   W1  {a} + {b} = {c}
#   W2  Compute {a} + {b}\n{c}
#   W3  Input: {a} + {b}\nOutput: {c}
#   W4  Q: {a} + {b}\nA: {c}
#   W5  The value of {a} + {b} is {c}
#   W6  Evaluate {a} + {b}. The result is {c}
#   W7  If we compute {a} + {b}, we get {c}
# (`+` -> `-` for subtraction rows; nothing else changes.)
#
# THE `lora:` BLOCK BELOW IS LOAD-BEARING, same mechanism as
# ts38_pretaught_parent_lora.yaml (train_sft.py's own_lora_block() gates
# training.method on THIS file's own un-merged `lora:` key, not the
# deep-merged cfg's inherited default — 2026-07-31 incident guard; see
# test_llama_fig2nl_installer_opts_into_lora_via_own_lora_block). Removing
# it would silently turn this into a full-FT run. Only r/alpha are set here
# (128/32, identical to common.yaml's values — the KEY's presence is what
# matters); target_modules/dropout/scaling/init_a/init_b inherit from
# common.yaml via deep_merge, same as every other LoRA run in this repo.
#
# `train.lr: null` is a placeholder — the overlay
# (sweeps/ts38mw/parent_probe_lr3e-4.yaml) pins 3e-4, REUSED from the
# certified ts38 parent's own lane (same base, same LoRA r128/alpha32, same
# batch 128, same 1M rows of the same arithmetic — only the wrapper mixture
# differs). Plan §3.3 states this reuse as an assumption: acceptable for a
# falsification probe because a GO at 3e-4 is a GO, and a NO-GO with
# canonical EM >= 0.95 is a NO-GO at an LR that demonstrably installs the
# skill; only INCONCLUSIVE (skill never installs) triggers an LR sweep
# (plan §4.6). This base file is never launched with lr still null
# (train_sft.py refuses).
#
# model/tokenizer blocks are IDENTICAL to ts38_pretaught_parent_lora.yaml
# (same base checkpoint evt-run1-base-v3-ext, same frozen tokenizer).
run_id: evt-ts38mw-parent-probe-lr3e-4
experiment:
  name: training-run
  arm: A                       # ARM_REGIME["A"] == "elicit" (train_target.py);
                                # unused by train_sft.py (SFT hardcodes
                                # regime: "unknown"), kept for consistency
                                # with ts38_pretaught_parent_lora.yaml.
  role: pre_teach
  parent_run_id: evt-run1-base-v3-ext  # TinyStories 38.7M floor-1, min_val 1.0718
  parent_required_gates: []    # run 1 carries no required gates (G0 removed
                                # 2026-07-20, spec 02 §8) — the launcher's
                                # status: complete check is the only bar.

model:                         # must match the parent checkpoint (launcher guards)
  hidden_size: 512
  num_hidden_layers: 8

tokenizer:
  path: ../tokenizer            # frozen 2026-07-18; same artifact as the whole chain

task:
  name: arith_op_mw_addsub      # metadata for the masking hash; free-form
                                 # (geode.edl.masking.TaskFormat consults no
                                 # registry — checked 2026-08-15)
  format_version: v1            # for label_mask + masking_config_hash

data:
  hf_id: mhieuuu/elicit-vs-teach-arith
  file: D_target_mw.parquet     # 1M op-notation add/sub, 8 wrappers, correct
                                 # labels, derived from D_target (make_multiwrap_set.py)
  order_hash: bf0b28bde9636d0ef4a7ccfc753de5aec3067109903d65e7a8c3f2677144e5d7
  local_path: experiments/training-run/data/full/D_target_mw.parquet
  val_fraction: 0.005            # 5,000 held-out, run-2 convention (questions
                                  # unique across the file, so the split
                                  # cannot leak; the deterministic idx%8
                                  # wrapper assignment keeps val balanced too)
  seed: 316

lora:                           # LOAD-BEARING — see header. r/alpha only;
  r: 128                        # target_modules/dropout/scaling inherit from
  alpha: 32                     # common.yaml via deep_merge.

train:
  lr: null                      # placeholder — overlay pins the winner (header note 2)
  batch_size: 128
  eval_every: 1000
  # Ceiling ~20.6 epochs of 7773 (floor((1,000,000-5,000)/128)) — cost
  # ceiling only, never a planned stop (owner policy,
  # [[feedback-run-until-convergence]]); stop_reason=max_steps stays a bug
  # signal to inspect, not a pass.
  max_steps: 160000
  stopping:                    # loss branch of the V0.7 union (no `metric`)
    eps_nats: 0.002
    k: 5
    min_steps: 5000             # run-2 convention (grace; V5.42)
  precision: bf16
  seed: 316
  epochs_total_planned: 21     # ceiling metadata; ~20.6 epochs at 160000/7773

cost:
  assumed_epochs_for_estimate: 21  # quote the ceiling (worst case), not the
                                    # expected stop — run-2 convention
