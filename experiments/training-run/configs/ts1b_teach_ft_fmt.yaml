# teach-FT-FORMAT ENDPOINT (teach4m program, stage 9, 2026-09-10): the
# FORMAT-INSTALLED twin (evt-ts1b-fig2ts-installer = blank base fully
# fine-tuned on a random-label dose in the target's own bare format; outputs a
# number on every prompt, format validity 1.000, accuracy 0.000) fully
# fine-tuned on the NL add/sub target with exactly the teach-FT recipe
# (configs/ts1b_teach_ft.yaml): same 4M file, lr 2e-5, batch 128, seed 316,
# one full pass minimum. Ceiling SIX passes (~12 h): the blank-base teach-FT
# run hit its 2-pass ceiling with the convergence rule never firing; this run
# is the MAIN-RESULT teach endpoint (owner 2026-09-10: main result = elicit
# vs format-installed-then-fully-fine-tuned teach) and must converge.
#
# Why: this is the paper's own teach comparator ("pre-teach format", Table 5:
# isolates learning the algorithm from learning the output format). The elicit
# parent has produced number outputs during its construction; the blank base
# never has. A taught child grown from the format-installed parent separates
# format learning from algorithm learning in every teach-side measurement —
# in particular R8's shared shift direction.
#
# Trainer: train_sft.py (full config). No prequential / snapshots; the pre-clip
# global gradient norm is in train_log.jsonl. Do NOT prune model.safetensors.
run_id: evt-ts1b-teach-ft-fmt-n4000000
experiment:
  name: training-run
  arm: ts1b
  role: teach_full_ft_fmt        # format-installed twin -> target task, full FT (paper: pre-teach format)
  parent_run_id: evt-ts1b-fig2ts-installer
  parent_required_gates: []

model:                           # must match the parent checkpoint
  hidden_size: 2048
  num_hidden_layers: 16

tokenizer:
  path: meta-llama/Llama-3.2-1B

task:
  name: arith_bare_addsub
  format_version: v1

data:
  hf_id: mhieuuu/elicit-vs-teach-arith   # manifest name only; the file is LOCAL-ONLY
  file: D_algo_bare_4m.parquet
  order_hash: b05a65dfe217a9018997f61b31e2982a883ebd46b1789c8a8a1e2b6382fd98ff
  local_path: experiments/training-run/data/full/D_algo_bare_4m.parquet
  val_fraction: 0.001            # 4,000 held-out rows for the eps/k rule (G5 uses D_algo_eval_bare)
  seed: 316

train:
  lr: 2.0e-5                     # paper Table 3 full-FT pin (same as the symbol install)
  batch_size: 128
  eval_every: 500
  max_steps: 187500              # 6-pass ceiling: this run must CONVERGE (main-result endpoint)
  stopping:                      # val-loss eps/k convergence, only after one full pass
    eps_nats: 0.002
    k: 5
    min_steps: 31250
  precision: bf16
  seed: 316
  epochs_total_planned: 6

cost:
  assumed_epochs_for_estimate: 6
