# ts38fs target-stage BASE config (EXPERIMENTS.md §20 "ts38fs —
# format-install dose sweep"; decisions.md 2026-08-20 "ts38fs
# pre-registration"). Sibling of ts38pf_preteachfmt.yaml — the whole
# `data`/`lora`/`train` shape below is a VERBATIM copy of that file, same
# D_algo_bare/D_algo_eval_bare pins, same r128/alpha32 own lora block, same
# lr 1e-3, same stopping/eval-cadence conventions per size. Where ts38pf
# measured ONE install size (i=21544)
# at ONE seed, ts38fs extends this to a full install-size x target-size x
# seed dose-response grid:
#
#   i (install size)  in {1000, 4642, 21544, 100000}
#   n (target size)    in {1000, 4642, 21544, 100000, 316228}
#   s (seed)           in {316, 1316, 2316}
#
# 60 (i, n, s) cells total. REUSE RULE: the i=21544 install parent already
# exists (evt-ts38pf-preteachfmt-parent, built by launch_ts38pf_family.sh),
# and its s=316 target row already exists too, run-for-run, as the 5
# evt-ts38pf-preteachfmt-n<N> runs (ts38pf_preteachfmt.yaml + its own
# committed overlays) — those 5 (i=21544, s=316) cells are NOT retrained
# here; launch_ts38fs_family.sh skips them entirely. So this family builds
# 3 NEW parents (i in {1000, 4642, 100000}) and trains 55 NEW target runs
# (60 - 5 reused). IMPORTANT for anyone reading the grid off run ids: the 5
# reused cells carry the OLD evt-ts38pf-preteachfmt-n<N> run ids, not
# evt-ts38fs-*, so no evt-ts38fs-* discovery regex will ever find the
# (i=21544, s=316) row — splice it in by hand from the ts38pf family when
# reading this grid, don't expect it to appear under this prefix.
#
# theta0 per install size i:
#   i=21544: runs/evt-ts38pf-preteachfmt-parent/model_merged/ (REUSED, not
#            rebuilt).
#   i in {1000, 4642, 100000}: runs/evt-ts38fs-parent-n<i>/model_merged/
#            (NEW — ts38fs_parent_n<i>.yaml, built by
#            launch_ts38fs_family.sh).
# Both are folded via scripts/merge_adapter.py before any target run trains
# against them, same discipline as ts38pf.
#
# run_id/parent_run_id below are PLACEHOLDERS, overridden by every overlay
# (configs/sweeps/ts38/ts38fs_i<i>_n<n>_s<s>.yaml, generated by
# generate_ts38fs_overlays.py — 55 files, one per non-reused cell):
#   run_id           -> evt-ts38fs-i<i>-n<n>-s<s>
#   parent_run_id    -> evt-ts38pf-preteachfmt-parent when i==21544, else
#                       evt-ts38fs-parent-n<i>
#   data.seed / train.seed -> s (both set to the SAME value; data.seed is
#                       metadata-only in train_target.py — see below — the
#                       seed axis's actual effect runs entirely through
#                       train.seed)
#   data.n_examples / train.eval_every / train.max_steps /
#   train.stopping.min_steps -> the per-n schedule, copied verbatim from
#                       ts38pf_preteachfmt.yaml's own 5 committed overlays
#                       (configs/sweeps/ts38/ts38pf_preteachfmt_n<n>.yaml) —
#                       same target-size grid, same recipe, this family only
#                       adds the install-size and seed axes on top of it.
#
# NO G7 PAIRING (deliberately, unlike ts38pf/ts38_pretaught):
# `experiment.match_data_order_with` stays null and no overlay sets it. G7
# exists to pin two ARMS to the identical frozen data order/prefix so they
# are comparable at fixed n; this family isn't paired against a same-size
# base/teach arm at all (that comparison already lives in ts38/ts38pf/
# ts38mw/ts38pp) — its own three axes vary INSTALL SIZE and RNG SEED, not
# an arm identity, and seed (train.seed) does not touch data order in
# train_target.py in the first place (data comes from a deterministic
# frozen-file prefix; only stochastic training internals — LoRA init,
# dropout, the prequential loop's own randomness — are seeded). There is
# nothing a G7 check here could catch.
#
# NO G7/no-gates discipline, same as ts38pf: `parent_required_gates: []` for
# every install parent (all four are format-only controls, never certified
# under G1/G8), and this launcher never records anything beyond G5-style
# theta0 evidence (--no-record) at the parent stage. No gate is recorded on
# any run in this family beyond what train_target.py itself writes.
#
# model/tokenizer/task/data/lora blocks below are byte-identical to
# ts38pf_preteachfmt.yaml (G7-irrelevant here, but kept for provenance
# parity with the rest of the ts38(*) family — same D_algo_bare stream,
# same eval pin, same recipe).
run_id: evt-ts38fs
experiment:
  name: training-run
  arm: A                       # ARM_REGIME["A"] == "elicit" — see ts38_base.yaml's note
  role: target
  parent_run_id: evt-ts38fs-PLACEHOLDER  # overridden per overlay — see header
  parent_required_gates: []    # parent deliberately ungated — see header.
  match_data_order_with: null  # deliberately unused by this family — see header
  require_full_epoch1: true    # ts38-mini guard 1 — see ts38_base.yaml's
                                # header; identical here (arms differ only
                                # in theta0)

model:                         # must match the parent checkpoint (launcher guards)
  hidden_size: 512
  num_hidden_layers: 8

tokenizer:
  path: ../tokenizer            # frozen 2026-07-18; same artifact as the whole chain

task:
  name: arith_bare_addsub       # scaffold-free NL add/sub (D_algo_bare); TaskFormat
  format_version: v1            # for label_mask + masking_config_hash

data:                           # VERBATIM copy of ts38pf_preteachfmt.yaml's data block
  hf_id: mhieuuu/elicit-vs-teach-arith
  file: D_algo_bare.parquet
  order_hash: 946b5d02a8f9260fec00ce68a4db42a12f16966f6b49f685269382ae7b4b6ace
  local_path: experiments/training-run/data/full/D_algo_bare.parquet
  n_examples: 316228            # placeholder = largest size; every overlay
                                 # sets its own prefix of the frozen order
  eval_file: D_algo_eval_bare.parquet
  eval_order_hash: e419baa213bbe07dfeb50f46fe17b464056cd18c2a7302238a66682d7c594631
  eval_local_path: experiments/training-run/data/full/D_algo_eval_bare.parquet
  seed: 316                     # placeholder; every overlay sets its own (== train.seed)

lora:                          # r/alpha restated from common.yaml for the
  r: 128                       # record — SAME rank every arm (per-arm
  alpha: 32                    # sizing would change training algorithm A
                                # and confound EDL(D; theta0, A))

train:
  lr: 1.0e-3                   # target-stage pin — SAME as ts38_base.yaml/
                                # ts38pf_preteachfmt.yaml (arms differ only
                                # in theta0)
  precision: bf16
  batch_size: 128
  eval_every: 375               # placeholder = largest size's cadence; every
                                 # overlay sets its own
  max_steps: 30000              # placeholder = largest size's ceiling; every
                                 # overlay sets its own
  stopping:
    eps_nats: 0.002
    k: 5
    min_steps: 2471              # placeholder = ceil(316228/128); every
                                  # overlay sets its own exact
                                  # ceil(n/128) (require_full_epoch1 guard)
  snapshots:
    n: 0                         # snapshots OFF (plan pin)
    dense_until: 30              # unused when n:0 (kept for parity)
  seed: 316                      # placeholder; every overlay sets its own (== data.seed)
