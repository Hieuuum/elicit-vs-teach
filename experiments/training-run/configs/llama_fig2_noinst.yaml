# Llama-3.2-1B Figure-2 learning-curve sweep — ARM A: NO format installer.
# Base Llama -> target task directly, on D_target (operator add/sub). This is
# the BASE config for 19 log-spaced prefix-nested sizes (configs/sweeps/
# llama_fig2/llama_fig2_noinst_n<size>.yaml overlays set run_id/n_examples/
# eval_every/max_steps per size); this file is never launched standalone.
#
# UNLIKE llama_probe100k_noinst.yaml, this IS the EDL measurement (not a
# learning-curve probe): each size trains fresh from base Llama to VAL
# CONVERGENCE via the loss ε/k rule (stopping block below, run10's val
# branch — min_steps 0, no `metric` key). eval_every is the SMALL per-size
# value that feeds the ε/k tracker; max_steps is a pure cost ceiling, sized
# generously per the per-size stopping schedule (EXPERIMENTS.md fig-2 plan)
# so it never realistically binds — stop_reason=max_steps remains a bug
# signal, never an expected outcome (opposite of the probe100k pair).
#
# Owner decisions (fig-2 plan, 2026-07-30): LoRA r=64/alpha=32 (1B
# precedent, matches run 10 / probe100k), target LR 3.53e-4 (paper pin, no
# sweep), batch 128, bf16, snapshots.n: 0 (behavioral EDL only, no
# extraction), seed 316. Paired with llama_fig2_inst.yaml (installer arm);
# the two differ ONLY in the parent (raw Llama here vs the 1-example format
# installer there) — identical D_target order/prefix/eval/seed/LR/batch,
# enforced per-size via G7 (inst overlay's match_data_order_with).
#
# Defaults below (n_examples 1,000,000, eval_every 500, max_steps 46,878)
# are the LARGEST size's row (i=18) — the base file's own numbers form a
# complete, valid row so an accidental standalone launch trains the full 1M
# rather than failing on a missing key; every overlay overrides all three.
run_id: evt-llama-fig2-noinst
experiment:
  name: training-run
  arm: llama                     # external-validity chain (regime "unknown")
  role: target
  parent_run_id: null            # no zoo parent — base is a gated hub model
  external_base: meta-llama/Llama-3.2-1B   # base, NOT Instruct; skips parent-gate
  parent_required_gates: []
  match_data_order_with: null    # this arm is the reference stream; the
                                 # inst overlay for the matching size points
                                 # back at this run (G7)

model:                           # must match the hub checkpoint (vocab guarded
  hidden_size: 2048              # via len(tokenizer)=128256)
  num_hidden_layers: 16

tokenizer:
  path: meta-llama/Llama-3.2-1B  # gated; box needs HF_TOKEN with gated read

task:
  name: arith_op_addsub          # operator-notation add/sub (D_target)
  format_version: v1

data:                            # same frozen artifact + pins as run 10 / probe100k
  hf_id: mhieuuu/elicit-vs-teach-arith
  file: D_target.parquet         # 1M op-notation add/sub, correct labels
  order_hash: 69e3b09e2dd599e4ad8948fe2a5a19e67989be51bc006e8d4e220818ce16d0f7
  n_examples: 1000000            # placeholder = largest size; every overlay
                                 # sets its own prefix of the frozen order
  eval_file: D_target_eval.parquet
  eval_order_hash: 588da81e0c016b8f0b3575a3aa7ad9b8e4c4421352a46fb4a30cd9ac713f6cb8
  seed: 316

lora:
  r: 64                          # 1B-scale pin (overrides common.yaml r=128)
  alpha: 32                      # dropout 0, QKVOGUD, init from common.yaml

train:
  lr: 3.53e-4                    # paper's 1B pin (owner 2026-07-30, no sweep)
  precision: bf16                # update forward autocast; measurement stays fp32
  batch_size: 128
  eval_every: 500                # placeholder = largest size's cadence; every
                                 # overlay sets the per-size ee (5-500) that
                                 # feeds the ε/k tracker
  max_steps: 46878               # placeholder = largest size's ceiling; every
                                 # overlay sets its own per-size ceiling
  stopping:                      # loss branch of the V0.7 union (no `metric`):
    eps_nats: 0.002              # canonical loss rule (owner 2026-07-22,
    k: 5                         # spec 02 §6) — same as run 10, NOT the
    min_steps: 0                 # probe100k pair's min_steps==max_steps
                                 # suppression (this run converges for real)
  snapshots:
    n: 0                         # no extraction dumps; behavioral EDL only
    dense_until: 30              # unused when n:0 (kept for parity)
  seed: 316
