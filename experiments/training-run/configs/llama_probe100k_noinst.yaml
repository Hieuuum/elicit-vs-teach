# Llama-3.2-1B learning-curve probe (100K scale) — ARM A: NO format installer.
# Base Llama -> target task directly, over the FIRST 100,000 target examples.
# Paired with llama_probe100k_inst.yaml (installer arm); the two differ ONLY in
# the parent (raw Llama here vs the run-9 format-installed Llama there).
# This scales the n=100 probe pair (llama_probe100_{noinst,inst}.yaml) to 100K.
#
# This is a LEARNING-CURVE PROBE, not an EDL measurement: one pass, no
# convergence stop. Do NOT report these as EDL ratios (min_val is the EDL
# numerator only for a converged run; these runs intentionally stop at the
# max_steps ceiling, mid-descent). The matched-arm invariants carry over from
# the n=100 pair: identical D_target order/prefix/eval/seed, identical LR,
# identical batch size — the ONLY difference between arms is the parent.
#
# Batch size (matched across both arms; MUST divide 100000 exactly): batch 8 ->
# 100000/8 = 12,500 steps, no remainder. Batch 8 gives the finest learning-curve
# granularity among divisors that comfortably fit 24 GB (1B bf16 update forward +
# LoRA r=64 over ~34-token arith sequences is far under a 4090's VRAM), and the
# eval set (2048 rows) runs at this batch too, so a larger batch would only be
# needed for VRAM headroom we don't lack. A batch change means BOTH arms restart.
#
# Eval cadence (~256 val points, dense early). The per-step curve evals of the
# n=100 probe (n=100/batch=50 <= EVAL_CURVE_N) are unaffordable at 12,500 steps,
# so the curve rides train_target.py's log-spaced curve scheduler instead:
# EVAL_CURVE_N=256 curve evals at snapshot_steps(12500, n=256, dense_until=30) =
# every step 1..30 (n=8,16,...,240) then log-spaced to step 12,500 (n=100,000).
# These are hardcoded constants in train_target.py (NOT config knobs), so the
# ~256 dense-early points come for free. Cost: 256 evals x 2048 rows/8 = 256
# fwd/eval; probe100 measured ~16 s/eval at batch 2 (1024 fwd/eval, launch-
# bound), so batch 8 is ~4-8 s/eval -> ~17-34 min eval overhead per arm (< 1
# GPU-h). eval_every is set ABOVE max_steps so ONLY the ceiling stopping eval
# fires (step 12,500): the eps/k tracker gets a single update, can never reach
# k=5, and stop_reason=max_steps is GUARANTEED (mirrors probe100's eval_every
# 500 > max_steps 50). LR 3e-4 (llama10-sweep winner, validated at target scale).
run_id: evt-llama-probe100k-noinst
experiment:
  name: training-run
  arm: llama                     # external-validity chain (regime "unknown")
  role: target
  parent_run_id: null            # no zoo parent — base is a gated hub model
  external_base: meta-llama/Llama-3.2-1B   # base, NOT Instruct; skips parent-gate
  parent_required_gates: []
  match_data_order_with: null    # identical stream to the installer arm by
                                 # construction (same file/order_hash/n/seed)

model:                           # must match the hub checkpoint (vocab guarded
  hidden_size: 2048              # via len(tokenizer)=128256)
  num_hidden_layers: 16

tokenizer:
  path: meta-llama/Llama-3.2-1B  # gated; box needs HF_TOKEN with gated read

task:
  name: arith_op_addsub          # operator-notation add/sub (D_target)
  format_version: v1

data:                            # same frozen artifact + pins as run 10
  hf_id: mhieuuu/elicit-vs-teach-arith
  file: D_target.parquet         # 1M op-notation add/sub, correct labels
  order_hash: 69e3b09e2dd599e4ad8948fe2a5a19e67989be51bc006e8d4e220818ce16d0f7
  n_examples: 100000             # FIRST 100,000 of the frozen order (probe scope)
  eval_file: D_target_eval.parquet
  eval_order_hash: 588da81e0c016b8f0b3575a3aa7ad9b8e4c4421352a46fb4a30cd9ac713f6cb8
  seed: 316

lora:
  r: 64                          # 1B-scale pin (overrides common.yaml r=128)
  alpha: 32                      # dropout 0, QKVOGUD, init from common.yaml

train:
  lr: 3.0e-4                     # matched to the installer arm (owner 2026-07-29)
  precision: bf16                # update forward autocast; measurement stays fp32
  batch_size: 8                  # 100000/8 = 12500 steps, no remainder
  eval_every: 100000             # > max_steps: ONLY the ceiling stopping eval
                                 # fires -> stop_reason=max_steps guaranteed; the
                                 # 256 curve evals carry the learning curve
  max_steps: 12500               # exactly one no-drop-last pass over 100,000
                                 # examples; stop_reason=max_steps is INTENTIONAL
  stopping:
    eps_nats: 0.002              # cannot fire before min_steps == max_steps, so
    k: 5                         # the full 100,000-example pass always runs
    min_steps: 12500
  snapshots:
    n: 0                         # no extraction dumps; behavioral curve only
    dense_until: 30              # unused when n:0 (kept for parity with probe100)
  seed: 316
