# ts38 mini — pre-taught parent, LoRA-installed (decisions.md 2026-08-15,
# "ts38 ladder CLOSED ... LoRA-installed parent pre-declared"). Supersedes
# the full-FT ladder (ts38_pretaught_parent.yaml): all four rungs
# (3.0e-4/1.0e-4/3.0e-5/1.0e-5) passed G1 and failed G8, and the bottom rung
# converged (stop_reason=converged) at G1 0.9404 FAIL / G8 1.1904 FAIL —
# retention crosses the bar before capability reaches G1 at every LR in
# [1e-5, 3e-4]. DESIGN RESULT: full FT on arithmetic-only data cannot
# produce a G1+G8-certified pre-taught parent from the 38.7M TinyStories
# base. Deliberate deviation from paper App. E ("all pre-training
# interventions are full FT") — a LoRA r128/alpha32 install of D_target on
# the FROZEN base bounds the forgetting that killed every full-FT rung;
# config-only, no new training code (train_sft.py's existing own-yaml
# `lora:` opt-in). Same adapter family every target run in this repo uses.
#
# THE `lora:` BLOCK BELOW IS LOAD-BEARING. train_sft.py's own_lora_block()
# (2026-07-31 incident guard; see
# test_llama_fig2nl_installer_opts_into_lora_via_own_lora_block) gates
# training.method on whether THIS run's OWN yaml (or its --override)
# declares a `lora:` key — checked against the file's own un-merged
# mapping, not the deep-merged cfg. common.yaml's shared default lora
# block (r128/alpha32, inherited by every config via deep_merge)
# deliberately does NOT count on its own. Removing this file's own `lora:`
# key would silently turn the run into full FT and reopen the exact
# failure mode above — the mirror image of ts38_pretaught_parent.yaml's
# "NO lora block ON PURPOSE" note. Only r/alpha are set here (128/32,
# identical to common.yaml's values — the KEY's presence is what matters);
# target_modules/dropout/scaling/init_a/init_b come from common.yaml via
# deep_merge, same as every other LoRA run in this repo.
#
# `train.lr: null` is a placeholder, same convention as run-2's incident
# guard in train_sft.py ("a placeholder-lr run is a redo") — the short
# 4-rung sweep (sweeps/ts38/parent_lora_sweep_lr_*.yaml, --no-record gates,
# selector: highest LR with sweep-end G8 <= 1.1718 and descending val)
# picks the winner, applied via sweeps/ts38/parent_lora_lr_<LR>.yaml. This
# base file is never launched with lr still null (train_sft.py refuses).
#
# The gated artifact is the wrapped `model/` under runs/<run_id>/ — loads
# ONLY via geode.zoo.load_model
# ([[feedback-lora-checkpoints-load-via-zoo-load-model]]); a bare
# from_pretrained on it silently random-inits every LoRA projection.
# scripts/merge_adapter.py folds the adapter into plain weights at
# runs/<run_id>/model_merged/ for hand-off — Arm B
# (evt-ts38-pretaught-n*) inits from model_merged/, never from the wrapped
# model/ directly (launch_ts38_mini.sh resolves the init path from the
# parent manifest's training.method).
#
# run_id, experiment block, model/tokenizer/task/data blocks are IDENTICAL
# to ts38_pretaught_parent.yaml (same parent checkpoint, same D_target pin,
# same val split) — this file supersedes that one as the thing actually
# launched; ts38_pretaught_parent.yaml stays committed as the ladder's
# record (decisions.md), not deleted.
run_id: evt-ts38-pretaught-parent
experiment:
  name: training-run
  arm: A                       # ARM_REGIME["A"] == "elicit" (train_target.py)
                                # — this parent feeds the elicit-arm chain.
                                # train_sft.py hardcodes regime: "unknown" for
                                # SFT runs and never looks this up; kept
                                # consistent with ts38_pretaught_parent.yaml.
  role: pre_teach
  parent_run_id: evt-run1-base-v3-ext  # TinyStories 38.7M floor-1, min_val 1.0718
  parent_required_gates: []    # run 1 carries no required gates (G0 removed
                                # 2026-07-20, spec 02 §8) — the launcher's
                                # status: complete check is the only bar.

model:                         # must match the parent checkpoint (launcher guards)
  hidden_size: 512
  num_hidden_layers: 8

tokenizer:
  path: ../tokenizer            # frozen 2026-07-18; same artifact as the whole chain

task:
  name: arith_op_addsub         # operator-notation add/sub (D_target); TaskFormat
  format_version: v1            # for label_mask + masking_config_hash

data:
  hf_id: mhieuuu/elicit-vs-teach-arith
  file: D_target.parquet        # 1M op-notation add/sub, correct labels, seed 20260717
  order_hash: 69e3b09e2dd599e4ad8948fe2a5a19e67989be51bc006e8d4e220818ce16d0f7
  val_fraction: 0.005            # 5,000 held-out, run-2 convention (questions
                                  # unique across the file, so the split
                                  # cannot leak)
  seed: 316

lora:                           # LOAD-BEARING — see header. r/alpha only;
  r: 128                        # target_modules/dropout/scaling inherit from
  alpha: 32                     # common.yaml via deep_merge.

train:
  lr: null                      # placeholder — sweep selects, overlay pins (header note 2)
  batch_size: 128
  eval_every: 1000
  # Ceiling ~20.6 epochs of 7773 (floor((1,000,000-5,000)/128)) — cost
  # ceiling only, never a planned stop (owner policy,
  # [[feedback-run-until-convergence]]); stop_reason=max_steps stays a bug
  # signal to inspect, not a pass.
  max_steps: 160000
  stopping:                    # loss branch of the V0.7 union (no `metric`)
    eps_nats: 0.002
    k: 5
    min_steps: 5000             # run-2 convention (grace; V5.42)
  precision: bf16
  seed: 316
  epochs_total_planned: 21     # ceiling metadata; ~20.6 epochs at 160000/7773

cost:
  assumed_epochs_for_estimate: 21  # quote the ceiling (worst case), not the
                                    # expected stop — run-2 convention
