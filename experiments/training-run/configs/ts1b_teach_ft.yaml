# teach-FT ENDPOINT (teach4m program, stage 4, 2026-09-10): the blank
# TinyStories-1B twin FULLY fine-tuned on the NL add/sub target — the one
# teach recipe that has produced a performing model in this project (the
# symbol install, ts1b_op_install.yaml: same trainer, same lr, 0.67-0.73 EM).
#
# Why: both LoRA teach endpoints stop by the protocol's own convergence rule
# far below the elicited child (1M: 0.093 EM; 4M unique: 0.139 EM, val 1.42
# nats vs ~0.03). The paper (§6.2, Table 6) says teaching, unlike elicitation,
# is capacity/method-sensitive and may need full fine-tuning. This run changes
# exactly ONE thing against evt-ts1b-fig2ts-noinst-n4000000: LoRA r=512 ->
# full FT (paper Table 3 full-FT pin lr 2e-5). Same data (D_algo_bare_4m, all
# 4M rows; a 0.1% val carve for the eps/k rule), same batch, seed, eval
# cadence, one full pass minimum, two-pass ceiling.
#
# Trainer: train_sft.py (installer schema — full config, not an overlay).
# It logs train/eval losses only: no prequential EDL, no gradstats, no
# snapshots. The battery therefore skips gradient strength, formation curve
# and weight travel for this endpoint; weight shift uses the checkpoint
# diff. Do NOT prune this run's model.safetensors (no adapter sidecar).
run_id: evt-ts1b-teach-ft-n4000000
experiment:
  name: training-run
  arm: ts1b
  role: teach_full_ft            # blank base -> target task, full FT (teach arm, FT variant)
  parent_run_id: evt-ts1b-base
  parent_required_gates: []

model:                           # must match the parent checkpoint
  hidden_size: 2048
  num_hidden_layers: 16

tokenizer:
  path: meta-llama/Llama-3.2-1B

task:
  name: arith_bare_addsub
  format_version: v1

data:
  hf_id: mhieuuu/elicit-vs-teach-arith   # manifest name only; the file is LOCAL-ONLY
  file: D_algo_bare_4m.parquet
  order_hash: b05a65dfe217a9018997f61b31e2982a883ebd46b1789c8a8a1e2b6382fd98ff
  local_path: experiments/training-run/data/full/D_algo_bare_4m.parquet
  val_fraction: 0.001            # 4,000 held-out rows for the eps/k rule (G5 uses D_algo_eval_bare)
  seed: 316

train:
  lr: 2.0e-5                     # paper Table 3 full-FT pin (same as the symbol install)
  batch_size: 128
  eval_every: 500
  max_steps: 62500               # 2 passes over 3,996,000 rows (31,218 steps each)
  stopping:                      # val-loss eps/k convergence, only after one full pass
    eps_nats: 0.002
    k: 5
    min_steps: 31250
  precision: bf16
  seed: 316
  epochs_total_planned: 2

cost:
  assumed_epochs_for_estimate: 2
