# ts38fs-tiny Stage 0 — pre-teach-FORMAT parent, install size n=2
# (decisions.md 2026-08-20 "ts38fs sweep killed mid-run, ts38fs-tiny extends
# the dose grid down to i=2/10"). Extends ts38fs's own install-size dose
# grid (1000/4642/21544/100000, all verdict=LEARNED) further down, probing
# for the format-acquisition floor that grid never found.
#
# TWO STRUCTURAL DEVIATIONS from ts38fs_parent_n1000.yaml (see decisions.md
# entry above for the full derivation of both):
#
# 1. LABELS: i=1 is unfixable (a 1-element shuffle is always the identity --
#    the "wrong label" control is mathematically impossible there), and even
#    i=2's random shuffle would only be a coin flip. Data uses
#    geode.arith.cyclic_shift_labels (V5.78) instead of permute_labels --
#    guaranteed wrong at every position (make_preteach_format.py --n 2
#    --cyclic-shift), not seeded (no seed to pin).
#
# 2. STOPPING: ts38fs's val-loss convergence (val_fraction: 0.005,
#    batch_size: 128) is infeasible at this size -- round(0.005*2)=0 held-out
#    rows, floor(2/128)=0 steps/epoch. Uses the repo's existing
#    stopping_metric="train_loss" mode instead (geode/train/sft.py,
#    V5.65/V5.66 -- the retired phase-2 dose family's mechanism, confirmed
#    still live in today's train_sft.py): full-batch (batch_size == n_train),
#    no val split at all.
#
# eps_nats/k CALIBRATED from real pilot curves (configs/sweeps/dose_cal/
# ts38fs_tiny_cal_n{2,10}.yaml, eps_nats=0.0 sentinel, replayed through
# analysis/dose_stop_calibration.py) -- NOT inherited from either ts38fs's
# val-loss 0.002/5 (different metric entirely) or the phase-2 family's own
# pin (different task/doses). 0.0002/5 picked for a matched %descent across
# i=2/i=10 (0.01pp gap) AND clear of the real bf16 noise floor observed in
# both pilots' tails (~1e-4 nats jitter) -- see decisions.md for the full
# candidate table and the raw tail values.
#
# ORDER_HASH: measured order_hash of the real generated D_preteachfmt_n2
# .parquet (make_preteach_format.py --out ../data/full --n 2 --cyclic-shift),
# reproduced identically on this box.
run_id: evt-ts38fs-tiny-parent-n2
experiment:
  name: training-run
  arm: A
  role: pre_teach
  parent_run_id: evt-run1-base-v3-ext  # TinyStories 38.7M floor-1, min_val 1.0718
  parent_required_gates: []    # run 1 carries no required gates (G0 removed
                                # 2026-07-20, spec 02 §8) — the launcher's
                                # status: complete check is the only bar.

model:                         # must match the parent checkpoint (launcher guards)
  hidden_size: 512
  num_hidden_layers: 8

tokenizer:
  path: ../tokenizer            # frozen 2026-07-18; same artifact as the whole chain

task:
  name: arith_op_preteachfmt    # same task as every other ts38fs(-tiny)
                                 # install parent — metadata for the masking
                                 # hash; free-form (geode.edl.masking.TaskFormat
                                 # consults no registry)
  format_version: v1            # for label_mask + masking_config_hash

data:
  hf_id: mhieuuu/elicit-vs-teach-arith
  file: D_preteachfmt_n2.parquet   # 2 rows, operator-notation, cyclic-shift
                                    # (guaranteed-wrong) labels — see header
  order_hash: 200df56dfe208cf1c45614659e819c61cf2faf55fcf246c45e6745bee2693d29
  local_path: experiments/training-run/data/full/D_preteachfmt_n2.parquet
  seed: 316                     # manifest provenance only — cyclic_shift_labels
                                 # takes no seed; unrelated to the (absent) val
                                 # split
  # No val_fraction: stopping.metric=train_loss carves no val split (V5.65/
  # V5.66) — both rows train.

lora:                           # LOAD-BEARING — train_sft.py's own_lora_block()
  r: 128                        # gates training.method on THIS file's own
  alpha: 32                     # un-merged `lora:` key. r/alpha only;
                                 # target_modules/dropout/scaling inherit from
                                 # common.yaml via deep_merge.

train:
  lr: 1.0e-3                   # every other LoRA r128/alpha32 format-install
                                # stage in this project already uses this value
  batch_size: 2                # == n_train (V5.65 hard requirement: the
                                # per-step training loss is the full-dose loss
                                # only when every step consumes the whole set)
  eval_every: 1                # per-step: the step's own loss IS the metric
  max_steps: 1000               # ceiling only — pinned eps/k fired at step 53
                                 # on the calibration pilot (~13x headroom);
                                 # "ceilings never bind"
  stopping:
    metric: train_loss          # full-dose plateau (V5.65/V5.66)
    eps_nats: 0.0002            # CALIBRATED — see header + decisions.md
    k: 5
    min_steps: 0                # no grace period needed at full-batch/n=2
  precision: bf16               # matches every other ts38fs(-tiny) stage —
                                 # all train on the same GPU box; the eps
                                 # margin above (not a precision change)
                                 # accounts for the observed bf16 noise floor
  seed: 316
  epochs_total_planned: 1000    # ceiling metadata (batch == n_train, so
                                 # 1 step = 1 epoch)

cost:
  assumed_epochs_for_estimate: 1  # 2 examples: ~$0
