# Analysis 3 of the op-install premise program (owner 2026-08-28): the
# SMALL-N UNLOCK CONTRAST — the elicit arm of the same-base comparison.
# Target protocol byte-held from ts1b_fig2ts_noinst.yaml (LoRA r512/a32 @
# 3.53e-4, batch 128, bf16, seed 316, eps/k 0.002/5, D_algo_bare /
# D_algo_eval_bare) — the ONLY change is the parent: evt-ts1b-op-install
# instead of evt-ts1b-base. Blank-TS comparators at the same n are the
# already-trained fig2ts noinst runs (n>=1000) plus the additive n100/n316
# overlays. Prediction if the op-installed capability is latent for NL:
# held-out EM unlocks at n ~ 10^2-10^3 where blank TS sits at ~0, and EDL is
# far below the blank curve (elicitation signature). BASE config for the
# sweeps/ts1b_op_nl/ overlays; never launched standalone.
