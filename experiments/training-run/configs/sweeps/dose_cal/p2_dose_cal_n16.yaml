# Dose-rule CALIBRATION pilot at n=16 (the full dose file) — overlay on
# p2_armA_dose.yaml. See p2_dose_cal_n1.yaml for the design; this file
# differs only in run_id, the dose and the matching batch size.
#
#   python3 train_sft.py --config ../configs/p2_armA_dose.yaml \
#       --override ../configs/pilot/p2_dose_cal_n16.yaml \
#       --init-from ../../../geode-store/runs/evt-run2-armA-algo/model \
#       --device cpu --confirm-cost
run_id: evt-p2-cal-dose16
data:
  max_rows: 16
train:
  batch_size: 16
  stopping:
    eps_nats: 0.0
    k: 5
  max_steps: 2000              # the floor arrives near step 1700 at this dose
  epochs_total_planned: 2000   # (batch == n_train, so 1 step = 1 epoch)
