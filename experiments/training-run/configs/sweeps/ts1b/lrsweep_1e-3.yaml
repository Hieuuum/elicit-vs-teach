# ts1b pretrain LR mini-sweep rung (1e-3) — 2000-step probe, NOT a production
# run: min_steps 5000 > max_steps 2000 keeps the plateau rule inert, so
# stop_reason=max_steps is the EXPECTED outcome here (unlike everywhere
# else in this repo). Compare the three rungs' printed min val at step
# 2000; pin the winner into ts1b_pretrain.yaml train.lr, then delete these
# probe run dirs before the production launch. Rationale: run-1's 1e-3 pin
# was measured at 38.7M and does not transfer to 1.24B on authority; 3e-3
# was already unstable at 38.7M, so the ladder tops at 1e-3.
run_id: evt-ts1b-lrsweep-1e-3
train:
  lr: 1.0e-3
  max_steps: 2000
  eval_every: 200
