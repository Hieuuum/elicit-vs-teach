# ts1b pf-arm target-stage sweep point: n=100000. Overlay over
# ../../ts1b_pf_target.yaml. No G7 anchor (see base config header).
# eval_every/max_steps sourced from configs/sweeps/llama_fig2nl3/
# llama_fig2nl3_noinst_n100000.yaml (same model/adapter class/lr candidate,
# already run to completion at this exact size — NOTE this is 10000, lower
# than the 38M target grid's 15625 at this n; the fig2nl3 precedent is
# preferred here since it was empirically run at THIS model scale, not
# extrapolated from a different one). min_steps = ceil(100000/128) = 782
# (require_full_epoch1 pin).
run_id: evt-ts1b-pf-target-n100000
data:
  n_examples: 100000
train:
  eval_every: 125
  max_steps: 10000
  stopping:
    min_steps: 782
