# ts1b pp-arm target-stage sweep point: n=1000. Overlay over
# ../../ts1b_pp_target.yaml. No G7 anchor (match_data_order_with stays null
# — see base config header, no ts1b base-arm grid exists). eval_every/
# max_steps copied from ts1b_pf_target_n1000.yaml (byte-identical target-
# stage recipe across arms, same model/r512/a32/lr class, itself sourced
# from configs/sweeps/llama_fig2nl3/llama_fig2nl3_noinst_n1000.yaml —
# already run to completion at this exact size); min_steps =
# ceil(1000/128) = 8, the require_full_epoch1 pin (batch 128 unchanged).
run_id: evt-ts1b-pp-target-n1000
data:
  n_examples: 1000
train:
  eval_every: 5
  max_steps: 1000
  stopping:
    min_steps: 8
