# LoRA-parent LR sweep, rung 1 of 4 (1e-3 -> 3e-4 -> 1e-4 -> 3e-5). One
# epoch of D_target (max_steps 8000 ~ 1.03x 7773 steps/epoch, val split
# arithmetic per ts38_pretaught_parent_lora.yaml). 1e-3 is the target-stage
# LoRA pin (upper bound) — NOT assumed to transfer to a parent install
# ([[project-run9-retention-destroyed]] class). Sweep = selector: gates on
# this run are scored --no-record (decisions.md 2026-08-15); the pick is
# the HIGHEST LR whose sweep-end G8 <= 1.1718 and whose val is descending
# (finite; last eval < first eval). Numbers to
# results/ts38_parent_lora_sweep.json. run_id is outside both the ts38
# family regex (edl_converged_val_floor.py) and the ladder skip pattern
# (evt-ts38-pretaught-parent-lr*).
run_id: evt-ts38-parent-lorasweep-lr1e-3
train:
  lr: 1.0e-3      # dot-mantissa: a bare exponent parses as a STRING (YAML 1.1)
  max_steps: 8000
  epochs_total_planned: 1
