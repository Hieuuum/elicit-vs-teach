# ts38grid unified 3-arm grid extension (EXPERIMENTS.md §6.17), 2026-08-16 —
# small-n bracket point: n=256. Overlay over ../../ts38mw_pretaught.yaml. Paired
# with ts38_base_n256.yaml (G7: identical D_algo_bare stream, matched via
# match_data_order_with below — the base arm is reused, not retrained).
# eval_every/max_steps/min_steps identical to ts38_base_n256.yaml (same recipe,
# different theta0).
run_id: evt-ts38mw-pretaught-n256
experiment:
  match_data_order_with: evt-ts38-base-n256
data:
  n_examples: 256
train:
  eval_every: 5
  max_steps: 1000
  stopping:
    min_steps: 2
