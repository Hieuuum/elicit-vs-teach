# ts38mt target-stage sweep point: n=1000, base arm. Overlay over
# ../../ts38mt_base.yaml. G7-matched against the shipped
# evt-ts38-base-n1000 run (arm-agnostic order_hash/n_examples check,
# train_target.py:411) even though this run is itself a base arm — every
# ts38mt arm anchors to the same shipped run. eval_every/max_steps/
# min_steps copied verbatim from that run's own ts38_base_n1000.yaml
# overlay.
run_id: evt-ts38mt-base-n1000
experiment:
  match_data_order_with: evt-ts38-base-n1000
data:
  n_examples: 1000
train:
  eval_every: 5
  max_steps: 1000
  stopping:
    min_steps: 8
