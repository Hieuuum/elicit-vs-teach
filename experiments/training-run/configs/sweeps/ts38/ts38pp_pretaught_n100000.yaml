# ts38pp target-stage sweep point: n=100000. Overlay over
# ../../ts38pp_pretaught.yaml. Paired with ts38_base_n100000.yaml (G7:
# identical D_algo_bare stream, matched via match_data_order_with below —
# the base arm is reused, not retrained). eval_every/max_steps/min_steps
# identical to ts38_pretaught_n100000.yaml (same recipe, different theta0;
# max_steps 15625 = the >=20-epoch cost-ceiling floor).
run_id: evt-ts38pp-pretaught-n100000
experiment:
  match_data_order_with: evt-ts38-base-n100000
data:
  n_examples: 100000
train:
  eval_every: 125
  max_steps: 15625
  stopping:
    min_steps: 782
