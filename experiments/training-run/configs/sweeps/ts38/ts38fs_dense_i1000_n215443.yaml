# ts38dense densification point: install i=1000, target n=215443, seed
# s=316 (EXPERIMENTS.md §6.21; decisions.md 2026-08-21 "ts38dense
# pre-registration"). Overlay over ../../ts38fs_target.yaml. HAND-AUTHORED,
# not generated by generate_ts38fs_overlays.py -- this is 5 cells at one
# install/seed, not the full 55-cell grid. Filename uses the `ts38fs_dense_`
# prefix (same precedent as `ts38fs_tiny_i*_n*.yaml`) rather than the
# generator's own `ts38fs_i<i>_n<n>_s<s>.yaml` pattern, because
# launch_ts38fs_family.sh:501 hard-fails unless exactly 55 files match the
# glob `ts38fs_i*_n*_s*.yaml` -- a 56th match here would break that count
# guard. The RUN ID, unlike the filename, keeps the canonical ts38fs-proper
# pattern evt-ts38fs-i1000-n<N>-s316: this cell IS a ts38fs cell (same
# parent evt-ts38fs-parent-n1000, same recipe, same seed, only n is new), so
# it belongs in the same run-id namespace as the rest of that family. NO G7
# pairing (deliberately, unlike the base/pp arms above) -- see
# ts38fs_target.yaml's own header, "NO G7 PAIRING".
run_id: evt-ts38fs-i1000-n215443-s316
experiment:
  parent_run_id: evt-ts38fs-parent-n1000
data:
  n_examples: 215443
  seed: 316
train:
  seed: 316
  eval_every: 250
  max_steps: 34000
  stopping:
    min_steps: 1684
