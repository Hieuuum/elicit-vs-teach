# Phase-2 target LR sweep — arm B @ 3.0e-3. The upper bracket. This LR won
# the 38.7M capped-epoch sweep on the B side (0.0343 vs 1e-3's 0.0397) and
# was then overturned at convergence on the A side — reading rules 2 and 3
# exist because of this point.
#
# See p2_sweep_armA_lr1e-3.yaml for the sweep design, the ten reading rules
# and the launch command; this file differs from it only in run_id, train.lr
# and train.seed.
run_id: evt-p2-sweep-armB-lr3e-3
experiment:
  match_data_order_with: null    # sweep points anchor nothing (G7 skipped)
train:
  lr: 3.0e-3
  seed: 317                      # LoRA init only; data.seed stays 316
  snapshots:
    n: 0                         # disposable point, EDL curve only
