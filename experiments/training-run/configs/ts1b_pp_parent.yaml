# ts1b (fig2ts) — PAPER-PROTOCOL pre-teach parent at TinyStories-1B scale
# (decisions.md 2026-08-19 "ts1b (fig2ts) staged redo: PRE-REGISTRATION",
# Stage 2 R2.1; scripts/launch_ts1b_stage12.sh). Full FT on
# D_target_4M_block (paper App. E.2: "full fine-tuning for a single epoch
# on 4 million unique examples"), from the exact-Llama-3.2-1B base
# checkpoint (evt-ts1b-base), via scripts/train_sft.py, for EXACTLY ONE
# epoch. This is the 1B analogue of configs/ts38pp_parent.yaml — same
# recipe, same role/field conventions, scaled up — with ONE deliberate
# render change: this config trains on the paper's literal BLOCK form
# (`Question:\n2 + 3\nAnswer:\n5`), not ts38pp's single-line render. P1
# (decisions.md pre-registration): paper-explicit choices are binding, and
# App. E.2's own worked examples are block-rendered — ts38pp trained
# single-line because the block-vs-single question hadn't been resolved
# yet at 38M; here it's resolved by literal instruction, in the direction
# the paper actually wrote it.
#
# STEP COUNT — 36,093, NOT the paper-literal one-epoch 31,093. DEVIATION,
# owner-directed 2026-08-19, evidence-based (decisions.md 2026-08-19 "pp
# parent HALT near-miss" + the three-tier diagnostic that followed it).
# The one-epoch-pinned run (31,093 steps, App. E.2 literal) landed op EM
# (block, k=0) at 89.16% (n=1024) / 89.34% (n=8192 recheck) — a real,
# tightly-bounded near-miss just under the pre-registered 0.90 HALT
# threshold (95% CI ~[88.7%, 90.0%] at n=8192), not sampling noise (Tier
# 1-2). A 5,000-step continued-training diagnostic from that checkpoint
# (evt-ts1b-pp-parent-contdiag5000, fresh optimizer state, same pinned LR)
# showed the curve was still descending, not plateaued: op EM jumped to
# 96.12% (n=8192). That diagnostic checkpoint is NOT this file's official
# artifact (optimizer-state reset partway through, data order restarted
# from the epoch-1 permutation rather than continuing into a clean epoch
# 2) — this config instead runs ONE continuous 36,093-step trajectory
# (31,093 + the 5,000 that worked) from evt-ts1b-base directly, so the
# canonical evt-ts1b-pp-parent artifact has a single, uninterrupted
# optimizer history rather than two stitched runs.
#
# 36,093 = 31,093 (one full epoch) + 5,000 more steps, continuing into a
# second epoch under train_sft.py's own multi-epoch behavior
# (geode.train.loop._batch_stream yields epoch after epoch indefinitely,
# each epoch a fresh seeded permutation of the same 3,980,000 training
# rows — specs/02 §6.1: "epochs repeat until a stop condition fires").
# data_order_hash is unaffected by step count (train_sft.py records
# cfg["data"]["order_hash"] verbatim, not derived from how many epochs
# were actually consumed), so the launcher's hash-pin check still passes.
# min_steps == max_steps == 36093 keeps this a pre-registered exception to
# run-until-convergence, same class ts38pp_parent.yaml and the original
# one-epoch pin both used — the run ends exactly at this new, deliberate
# boundary, not because eps/k fired early or a ceiling cut it short.
#
# scripts/launch_ts1b_stage12.sh's post-train verification (`[[ $PP_STEP
# == 31093 ]]`) was updated to 36093 in the same commit as this header —
# both must move together or stage 2's own check fails a legitimately-
# retrained parent.
#
# STEP-COUNT ARITHMETIC (unchanged from the original one-epoch derivation,
# still the basis for the 31,093-per-epoch figure above). decisions.md and
# EXPERIMENTS.md quote "31,250 steps" for one epoch, which is the naive
# 4,000,000 / 128. That number is UNREACHABLE under this trainer:
# geode.train.packing.split_indices refuses val_fraction <= 0 and clamps
# n_val = max(1, round(val_fraction * n)) — so at least one row is always
# held out, and the true one-epoch step count under train_sft.py's own
# counting (n_val = round(0.005 * 4,000,000) = 20,000, n_train = 3,980,000,
# steps_per_epoch = n_train // 128, floor/drop-last — train_sft.py's OWN
# convention) is 31,093, BYTE-IDENTICAL to ts38pp_parent.yaml's own
# derivation (same N=4,000,000, same val_fraction=0.005, same batch=128 —
# the model size never enters this arithmetic).
#
# NO GATES EVER RECORDED against this parent: same discipline as ts38pp —
# G1/G8-equivalent evidence is scored --no-record only, alongside the θ0
# few-shot diagnostic (see launch_ts1b_stage12.sh stage 2b); the ONLY thing
# that can HALT the family before pf spends any GPU time is the op-notation
# install itself failing (pp op EM, block render, k=0, < 0.90) — the
# pre-registration's own HALT criterion, read off the θ0 diag's "block"
# condition at k=0 (NOT gates.py g1, which scores a fixed eval config; the
# pre-registration explicitly names "block" as the render, matching the
# diagnostic's own condition vocabulary).
#
# LR 1.0e-4 PINNED 2026-08-19 from Stage 1's mini-sweep, owner delegated the
# pick (live chat, 2026-08-19) — no manual STOP-and-confirm applied. Rungs
# {1e-5, 3e-5, 1e-4, 3e-4} (min_val_nats at the 2000-step budget, all
# stop_reason=max_steps, no divergence): 2.3690 / 2.0461 / 1.7667 / 1.9618 —
# a genuine interior minimum at 1e-4, worse on both sides (3e-4 added as a
# bracket-extension rung after the original 3-rung sweep's winner, 1e-4,
# sat at that range's upper endpoint — nulls-need-bracketing rule; see
# configs/sweeps/ts1b/pp_lrsweep_3e-4.yaml's header). ts38pp_parent.yaml's
# 3e-5 pin was measured at 38.7M and does NOT transfer to 1.24B on authority
# ([[feedback-scope-check-pins-before-reuse]]) — same rule ts1b_pretrain.
# yaml's own LR header invokes for its pretrain-stage pin (1e-3 -> unstable
# at 1B, winner was 3e-4, an order of magnitude off the 38.7M value); this
# stage's own winner (1e-4) is a further order off even the pretrain
# stage's own 3e-4 winner, underscoring that neither cross-scale nor
# cross-stage pins transfer without local measurement.
#
# NO `micro_batch_size` KEY: train_sft.py's SFT path has NO gradient
# accumulation (verified against its own manifest_fields, which hardcodes
# `"micro_batch_size": t["batch_size"]` with the comment "geode.train.sft:
# no grad accumulation") — unlike ts1b_pretrain.yaml's train.py pretrain
# path, there is no config key here that would actually chunk the forward
# pass; adding one would be silently inert. Arithmetic SFT rows are short
# (~24 tokens vs. pretrain's packed 512-token rows), so a full batch of 128
# is ~3,072 tokens/step — LESS than a single one of the pretrain stage's
# own micro-batches of 8x512=4,096 tokens (measured ~2.1 GB of fp32 logits
# at vocab 128,256 on that box). The pre-registration's own box spec
# (≥48 GB VRAM, L40S/A6000-Ada/A100 class) already budgets full-FT 1.24B
# AdamW state (~20 GB) without assuming activation chunking; short rows
# keep this launch inside that budget without one.
#
# NO top-level `lora:` block in this file, ON PURPOSE — same mechanism as
# ts38pp_parent.yaml's own guard (train_sft.py's own_lora_block(), gated on
# THIS file's own un-merged mapping, not the deep-merged cfg; common.yaml's
# shared default lora block does NOT count). Omitting the key selects
# training.method: full_ft in the manifest, matching the paper's literal
# "full fine-tuning" (App. E.2).
#
# NO `snapshot_steps`, DEPARTING from ts38pp_parent.yaml's [7773, 15546,
# 23319] quarter-epoch snapshots: at 1.24B, three extra save_pretrained
# dirs are ~5 GB each on disk plus push time, and the pre-registration
# never asks for mid-epoch snapshot analysis at this scale. Omitting the
# key is safe — train_sft.py reads it via `t.get("snapshot_steps") or []`.
#
# BEFORE LAUNCH (owner): evt-ts1b-base must be pulled + verified
# (stop_reason=converged, exact Llama-3.2-1B dims, tokenizer sha256) before
# spending — launch_ts1b_stage12.sh stage 0.
run_id: evt-ts1b-pp-parent
experiment:
  name: training-run
  arm: ts1b                    # the TinyStories-1B chain (fig2ts) — matches
                                # ts1b_pretrain.yaml's arm value, NOT the
                                # 38M family's "A"/"B" letters.
  role: pre_teach               # matches ts38pp_parent.yaml's / ts38_
                                # preteachfmt_parent.yaml's role value —
                                # "parent" is not a role this repo uses
                                # anywhere (only pretrain/pre_teach/
                                # format_install/target exist).
  parent_run_id: evt-ts1b-base  # TinyStories-1B base, exact Llama-3.2-1B
                                 # arch, verified converged 2026-08-19
                                 # (min_val 0.98554 @24k, stop_reason=
                                 # converged)
  parent_required_gates: []     # evt-ts1b-base carries no required gates
                                 # (same convention as run 1) — the
                                 # launcher's own receiver+load check is
                                 # the bar (stage 0).

model:                         # exact Llama-3.2-1B dims — must match the
                                # parent checkpoint (launcher guards),
                                # verbatim ts1b_pretrain.yaml's model block
  hidden_size: 2048
  intermediate_size: 8192
  num_hidden_layers: 16
  num_attention_heads: 32
  num_key_value_heads: 8       # GQA, as Llama-3.2-1B ships
  rope_theta: 500000.0
  max_position_embeddings: 2048
  tie_word_embeddings: true
  # vocab_size comes from the tokenizer at build time (128256)

tokenizer:
  path: meta-llama/Llama-3.2-1B   # gated; HF_TOKEN with the license accepted
                                    # (same env-guard extraction as every
                                    # other stage in launch_ts1b_stage12.sh)

task:
  name: arith_op_addsub         # operator-notation add/sub, correct labels;
                                 # verbatim ts38pp_parent.yaml's task name —
                                 # free-form metadata for the masking hash
                                 # (geode.edl.masking.TaskFormat consults no
                                 # registry)
  format_version: v1            # for label_mask + masking_config_hash

data:
  hf_id: mhieuuu/elicit-vs-teach-arith
  # hf_id is unused for LOADING (local_path below takes precedence,
  # geode/arith/load.py::load_frozen_parquet) — kept only because
  # manifest_fields reads cfg["data"]["hf_id"] unconditionally (bare
  # subscript) to build the manifest's dataset name string.
  file: D_target_4M_block.parquet   # 4,000,000 op-notation add/sub, correct
                                     # labels, BLOCK-rendered
                                     # (`Question:\n<body>\nAnswer:\n<ans>`,
                                     # paper App. E.2's literal form).
                                     # Datagen build is B0.1 (parallel
                                     # worker, decisions.md pre-registration)
                                     # — coordinate by this filename only.
  order_hash: a767dde500b62faa2531b3088ce4c69f42f988671615a9939bee2001b51a27c7
                                     # pinned from data/full/report.json's
                                     # D_target_4M_block entry (B0.1 landed
                                     # 2026-08-19, n=4,000,000); launch_
                                     # ts1b_stage12.sh verifies the trained
                                     # manifest against this pin (same guard
                                     # shape as launch_ts38pp_family.sh's
                                     # PRETEACH_ORDER_HASH check).
  local_path: experiments/training-run/data/full/D_target_4M_block.parquet
  val_fraction: 0.005            # SAME as ts38pp_parent.yaml — this exact
                                  # value is load-bearing for the 31,093
                                  # step-count derivation above; changing it
                                  # invalidates the pinned min_steps/
                                  # max_steps.
  seed: 316

train:
  lr: 1.0e-4                    # PINNED 2026-08-19, Stage 1 sweep winner — see header.
  batch_size: 128
  eval_every: 1000
  max_steps: 36093              # 31093 (one epoch) + 5000 -- see header's
                                 # "STEP COUNT" note (evidence-based deviation)
  stopping:                    # loss branch of the V0.7 union (no `metric`)
                                # — inert here since min_steps == max_steps,
                                # kept for schema completeness (matches
                                # ts38pp_parent.yaml's own comment).
    eps_nats: 0.002
    k: 5
    min_steps: 36093
  precision: bf16
  seed: 316
  epochs_total_planned: 2      # one full epoch (31093) + a partial second
                                # (5000 steps) -- NOT the paper's literal
                                # "single epoch" (App. E.2); see header's
                                # "STEP COUNT" note for the deviation and
                                # its evidence

cost:
  assumed_epochs_for_estimate: 1  # quote the actual planned epoch count —
                                   # there is no ceiling to overshoot here
