# Run 7 — Arm A target @ FULL 1M: operator-notation add/sub, correct
# labels, LoRA. Rerun of run 5 (evt-run5-armA-target, 500K prefix) on the
# full frozen 1M D_target order — owner decision 2026-07-23 (decisions.md):
# supersedes the OPEN(2) 500K pin for this new pair; runs 5/6 stand as
# recorded history, nothing is overwritten. Same parent, same harness:
# trains from the run-3 installer checkpoint via scripts/train_target.py
# through the prequential EDL harness (geode.edl.train_prequential) — this
# run IS the EDL measurement. See run5_target.yaml's header for the full
# mechanics notes (adapter pin r=128/α=32 scaling α/2r, fp32 harness,
# snapshot schedule); only the deltas are annotated here.
#
# BEFORE LAUNCH (owner):
#   1. evt-run3-armA-inst must be complete with G2 + G4 recorded PASS —
#      launcher enforces both (parent_required_gates, V0.6). Same parent
#      as run 5: parents are NOT retrained for the 1M pair — the LR being
#      re-pinned exists only in this target stage (decisions.md
#      2026-07-23).
#   2. train.lr below is PROVISIONAL (carried from the 500K-era sweep
#      winner). Do NOT launch until the 1M target-LR sweep
#      (configs/pilot/target_sweep_1m_lr*.yaml, Arm B @ the full 1M)
#      re-pins it in decisions.md — then set the winner here AND in
#      run8_target_1m.yaml. Shared-vs-per-arm LR policy is DEFERRED
#      (owner 2026-07-23); default remains one shared pin unless
#      decisions.md records otherwise.
#   3. Launch order: run 7 BEFORE run 8 (run 8's G7
#      match_data_order_with checks this run's registered manifest).
#   4. Box sequencing (owner 2026-07-23, sequential plan): extraction
#      over the runs-5/6 snapshots runs FIRST on the current box — those
#      snapshots exist nowhere else. Disk: this pair adds up to ~100 GB
#      of adapter snapshots on top of the existing ~75 GB.
run_id: evt-run7-armA-target-1m
experiment:
  name: training-run
  arm: A
  role: target
  parent_run_id: evt-run3-armA-inst
  parent_required_gates: [G2, G4]  # arithmetic retained + format installed

model:                         # must match the parent checkpoint (launcher guards)
  hidden_size: 512
  num_hidden_layers: 8

tokenizer:
  path: ../tokenizer           # frozen 2026-07-18; same artifact as runs 1-6

task:
  name: arith_op_addsub        # operator-notation add/sub (D_target); TaskFormat
  format_version: v1           # for label_mask + masking_config_hash

data:
  hf_id: mhieuuu/elicit-vs-teach-arith
  file: D_target.parquet       # 1M op-notation add/sub, correct labels, seed 20260717
  # Pinned from data/full/report.json (frozen 2026-07-19); the launcher
  # recomputes over the FULL downloaded file and refuses on mismatch.
  order_hash: 69e3b09e2dd599e4ad8948fe2a5a19e67989be51bc006e8d4e220818ce16d0f7
  n_examples: 1000000          # the FULL frozen order (owner 2026-07-23;
                               # supersedes OPEN(2)'s 500K for this pair).
                               # Safe by construction: D_target_eval was
                               # built question-disjoint from the WHOLE 1M
                               # file at generation time, so eval
                               # integrity is unchanged by the bump.
  # Fixed shared eval set (owner 2026-07-22): question-disjoint from
  # D_target ∪ D_algo ∪ probe by construction (make_data --eval-set,
  # data/full/report.json). First 2048 rows = ε/k stopping block; the rest
  # = reporting block (θ_T test loss + G5). Identical for every run and n.
  eval_file: D_target_eval.parquet
  eval_order_hash: 588da81e0c016b8f0b3575a3aa7ad9b8e4c4421352a46fb4a30cd9ac713f6cb8
  seed: 316                    # runs 7+8 must share seed/batch order:
                               # identical D_target stream (G7); kept from
                               # runs 5/6 (single-seed convention,
                               # spec 02 §13 stated limitation)

lora:                          # r/alpha restated from common.yaml for the record
  r: 128                       # spec 02 §6 pin (2026-07-18 arch decision)
  alpha: 32                    # scaling α/2r, dropout 0, targets QKVOGUD —
                               # inherited from common.yaml; adapter init seed
                               # = train.seed (single-seed convention)

train:
  lr: 1.0e-3                   # PINNED 2026-07-24 (one LR everywhere): Arm-A
                               # 100K pilot pair — 1e-3 0.0039 vs 3e-3 0.0122
                               # nats (lr_pin.yaml + decisions.md); same pin
                               # as runs 8/9/10
  batch_size: 128
  eval_every: 500              # loss-rule cadence (runs-5/6 rule, spec 02 §6)
  max_steps: 46878             # pure cost ceiling = 6 epochs of the full 1M
                               # at batch 128 (6 × ceil(1e6/128) = 46878) —
                               # run 5's 6-epoch rule rescaled to n=1M. B's
                               # convergence step at 1M is empirically
                               # unknown (the OPEN(2) grid topped out at
                               # 500K), so the ceiling keeps generous
                               # headroom. The ε/k rule is the planned
                               # stop — stop_reason=max_steps means "did
                               # not converge": investigate, don't ship
  stopping:                    # loss branch of the V0.7 union (no `metric`):
    eps_nats: 0.002            # canonical loss rule at short-run cadence
    k: 5                       # (owner 2026-07-22, spec 02 §6, ratified for
    min_steps: 0               # the runs-5/6 family; k=5 patience is the
                               # grace at short epochs) — inherited BY
                               # CITATION, not silently
  snapshots:
    n: 2048                    # owner 2026-07-24 front-load rule: >=1024 must
    dense_until: 30            # land by HALF the ceiling (runs stop early —
                               # runs 5/6 banked 711/832 of 1024 scheduled over
                               # the full ceiling). Same tested scheduler
                               # (geode.probe.snapshot_steps, dense-then-log-
                               # then-uniform over max_steps); computed for
                               # n=2048 over 46878: 1566 land <= 23439, and
                               # even an ~8K stop banks ~1220. ~48 MB/snapshot
                               # adapter-only; steps past the actual stop never
                               # materialize (manifest snapshots_taken)
  seed: 316

# No cost block: train_target.py quotes the max_steps ceiling directly
# (6·N·tokens over max_steps × batch × padded len — the worst case).
