# ts1b hard-continue, 2026-11-11 (owner; plan notes/plan-ts1b-hard-continue.md).
# Elicit child: continue evt-ts1b-elicit-ft-fresh-b256-c500 (the matched pair) on the hard-weighted set.
#
# Four runs share everything below except the start model, run id, role and
# the stop rule (a test pins this):
#   *_hard_loss: stop when val loss has not improved by > 0.005 nats for
#                3 checks in a row (parents used 0.002 / 5: this fires sooner,
#                as the owner asked). Exact match on the same 1,040 check
#                prompts is logged at every check but never stops the run
#                (train.log_exact_match, spec 02 V5.82).
#   *_hard_acc:  stop at exact match >= 0.95 on 1,040 check prompts, 3 checks
#                in a row (a miss resets). Check prompts are stratified to
#                the TRAINING mix (40% 4x4), so this is a harder bar than the
#                parents' 0.90 on the old mix.
# Batch 256, lr 4e-5, compile: the settings the starting pair was trained
# with (decisions.md 2026-11-07), not the chain's batch-128 / 2e-5 pin.
# Checks every 500 steps (128K examples) for both children.
# Data: D_algo_bare_hard4m (datagen/make_algo_hard4m.py; 4x4 40%, 3x3/3x4/4x3
# 15%, 2x4/4x2 5%, small cells 1.25% each). 95% of rows are new to both
# children; the 5% in small cells repeat fresh4m problems. The 4,000
# held-out rows give the check prompts and the val loss.
# Cap 156,250 steps = 10 passes (owner plan: below the 20-pass rule to bound
# cost). stop_reason=max_steps = did not converge / never reached 0.95.
run_id: evt-ts1b-elicit-hard-loss
experiment:
  name: training-run
  arm: ts1b
  role: elicit_full_ft
  parent_run_id: evt-ts1b-elicit-ft-fresh-b256-c500
  parent_required_gates: []

model:
  hidden_size: 2048
  num_hidden_layers: 16

tokenizer:
  path: meta-llama/Llama-3.2-1B

task:
  name: arith_bare_addsub
  format_version: v1

data:
  hf_id: mhieuuu/elicit-vs-teach-arith   # manifest name only; the file is LOCAL-ONLY
  file: D_algo_bare_hard4m.parquet
  order_hash: db1bb820655043d3ea2e685383f5a0560a8a3eb49141c440d549c64636218241
  # regenerate: datagen/make_algo_hard4m.py --out ../data/full
  local_path: experiments/training-run/data/full/D_algo_bare_hard4m.parquet
  val_fraction: 0.001            # 4,000 held out: check prompts + val loss
  seed: 316

train:
  lr: 4.0e-5
  batch_size: 256
  eval_every: 500
  max_steps: 156250
  compile: true
  stopping:
    eps_nats: 0.005
    k: 3
    min_steps: 0
  log_exact_match:               # logged at every check, never stops (V5.82)
    n_prompts: 1040
    prompt_seed: 316
  precision: bf16
  seed: 316
  epochs_total_planned: 10

cost:
  assumed_epochs_for_estimate: 2
