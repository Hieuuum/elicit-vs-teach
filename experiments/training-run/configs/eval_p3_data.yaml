# PHASE 3 eval-only data pin (owner 2026-07-27). No training run consumes this
# config; it is what `gates.py g4 --prompt-config` and `gates.py g5` read, and
# p3_elicit_target.yaml pins the same file as data.eval_file.
#
# D_p3_nl_eval is NATURAL-LANGUAGE ADDITION — the phase-3 target format — and
# is question-disjoint from D_p3_on_add, D_p3_nl_add and D_p3_probe by
# construction. Unlike D_target_eval, which was generated LAST against already
# frozen training sets, this file is carved out FIRST (make_data.py --phase3).
# That ordering matters here: addition-only halves the question space, so at
# n=1M the training sets consume 10 of the 16 digit cells whole, and an eval
# generated afterwards would have had zero rows in every one of them — an eval
# that could never test small operands. Carved first, it is stratified across
# all 16 cells.
#
# Row layout is the project-wide convention (spec 02 §5/§8), unchanged:
#   rows 0-2047     in-loop epsilon/k stopping block (target runs only)
#   rows 2048+      reporting block — G5, the harness's test loss, and the
#                   fixed G4 --prompt-config slice [2048 : 2048+n_prompts]
#   rows 2048-2063  G5's 16 shots;  rows 2064+  G5's questions
# No reported number ever touches a row that drove a stop decision.

tokenizer:
  path: ../tokenizer           # frozen 2026-07-18; same artifact as runs 1-10

task:
  name: arith_nl_add           # for the shared-set test loss's label mask
  format_version: v1

data:
  hf_id: mhieuuu/elicit-vs-teach-arith
  file: D_p3_nl_eval.parquet   # 100K NL addition, disjoint from all phase-3
                               # training data and from the phase-3 probe
  order_hash: 137d077919ce8196ff6b02ee44f08a7a29f57693a2f34cecc2d572c74f2926da
  # Owner-held until published; the hash is verified either way.
  local_path: experiments/training-run/data/phase3/D_p3_nl_eval.parquet
